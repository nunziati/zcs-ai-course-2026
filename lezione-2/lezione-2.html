document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ac6af953-c3bb-44dd-b999-6baa043ac4c6\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0;background:#101317}\na{color:#2f6bff}a:hover{color:#1c4fd8}\n@keyframes dcEnter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}\n@keyframes dcFade{from{opacity:0}to{opacity:1}}\nsection[data-label] div{flex-shrink:0}\n@media (prefers-reduced-motion:no-preference){\n[data-deck-active] [data-enter=\"rise\"]{animation:dcEnter .15s ease-out both}\n[data-deck-active] [data-enter=\"fade\"]{animation:dcFade .15s ease-out both}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"aa99bc4e-d109-4d93-aa59-746a7b15d771#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<section data-label=\"1 copertina\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"a3f9b02f\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 44px;font-size:36px;font-weight:700;letter-spacing:4px;color:#2f6bff\">MODULO 2<\u002Fp>\n    <h1 style=\"margin:0;font-size:140px;font-weight:700;letter-spacing:-4px;line-height:1.05\">Modelli predittivi su dati tabellari clinici<\u002Fh1>\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"2 divisoria · Passo 0\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"77aa5629\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    \n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Obiettivi e struttura della lezione<br><\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"4 elenco · argomenti\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"d19f4cda\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Argomenti della lezione<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>I dati:<\u002Fstrong> valori mancanti strutturali, feature engineering su valori di laboratorio, feature selection e sua stabilità.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>I modelli:<\u002Fstrong> dalla regressione logistica ai modelli additivi, al gradient boosting, alle reti tabellari e ai modelli fondazionali.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>La spiegazione:<\u002Fstrong> interpretabilità globale e locale, metodi intrinseci e post-hoc, e i loro limiti documentati.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>La valutazione:<\u002Fstrong> metriche su classi sbilanciate, calibrazione delle probabilità, quantificazione dell'incertezza, protocolli di validazione clinica.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>La produzione:<\u002Fstrong> monitoraggio, aggiornamento, e i vincoli normativi che decidono dove il modello può girare.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3;max-width:1520px\">Il filo è uno solo: <strong>seguire il numero prodotto dal modello dal dato che entra alla decisione che esce<\u002Fstrong>, e vedere in ciascun punto che cosa lo rende inaffidabile.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"5 divisoria · Passo 1\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"ace17dd1\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 1<\u002Fp>\n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Predizione su dati tabellari clinici<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"6 definizione · il problema\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"e6801fdd\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Definizione del problema<\u002Fh2>\n  <div style=\"background:#dfe9ff;padding:40px 48px;max-width:1660px\" data-enter=\"rise\"><p style=\"margin:0;font-size:46px;font-weight:700;line-height:1.3;letter-spacing:-1px\">Dato un insieme di variabili anagrafiche e di risultati di analisi di laboratorio riferiti a un singolo paziente in un singolo momento, stimare la <strong>probabilità<\u002Fstrong> che una determinata condizione clinica sia presente.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1520px;margin-top:40px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">l'uscita desiderata è un suggerimento per un clinico<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">le variabili disponibili <strong>possono cambiare da paziente a paziente&nbsp;<\u002Fstrong>(missing data)&nbsp;<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">la condizione da individuare è tipicamente <strong>rara<\u002Fstrong> nella popolazione osservata<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"7 colonne · dati tabellari\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"086c7f12\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Caratteristiche dei dati tabellari<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:70px;align-items:start\" data-enter=\"rise\">\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Immagini, testo, segnali<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">le componenti sono omogenee e confrontabili fra loro<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">spesso esiste una struttura locale (feature spazialmente o temporalmente vicini sono correlati)<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">l'ordine delle componenti è informativo<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">i dataset di riferimento sono grandi<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Dati tabellari<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">ogni attributo ha unità, scala e semantica proprie<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">nessuna struttura locale: le colonne non hanno correlazioni note a priori<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">l'ordine delle colonne è arbitrario<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">i dataset clinici sono tipicamente piccoli<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3;max-width:1520px\">Da queste differenze discende il fatto empirico che sui dati tabellari gli&nbsp;<strong>alberi di decisione&nbsp;<\u002Fstrong>restano competitivi con le architetture neurali, che invece dominano altrove.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"8 tabella · record clinico\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"3dde305c\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Struttura di un record clinico<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">gruppo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">esempi<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing: ;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fspan>esame non eseguito<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  \n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1620px;margin-top:30px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Non tutti i pazienti ricevono lo stesso insieme di analisi.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">L'assenza di alcune feature è<strong>&nbsp;un risultato naturale&nbsp;<\u002Fstrong>del processo che \"genera\" i dati (i flussi di lavoro clinici).<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Lo stesso vale in inferenza: il modello in produzione riceverà record incompleti.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv><div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:46px;font-weight:700;line-height:1.3\">Un modello addestrato sui soli casi completi è tarato su una popolazione che in inferenza non esiste.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"15 tabella · meccanismi\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:70px 110px 44px;box-sizing:border-box\" data-om-slide-id=\"e34c8954\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:40px 0 24px;max-width:1560px\">Meccanismi all'origine dei dati mancanti<\u002Fh2>\n  <p style=\"margin:0 0 28px;font-size:30px;line-height:1.35;max-width:1620px\">Sia <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">X<\u002Fspan> il dato completo e <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">M<\u002Fspan> la maschera che indica quali valori sono osservati.<\u002Fp>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">meccanismo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">da cosa dipende <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em;letter-spacing:0;text-transform:none\">M<\u002Fspan><\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">esempio clinico<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px 14px 0;border-bottom:2px solid #d4d7de\"><strong>MCAR<\u002Fstrong><span style=\"color:#4d5a78;margin-left:16px\"><em>missing completely at random<\u002Fem><\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px;border-bottom:2px solid #d4d7de\">da niente<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:14px 0 14px 22px;border-bottom:2px solid #d4d7de\">provetta rotta in trasporto<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px 14px 0;border-bottom:2px solid #d4d7de\"><strong>MAR<\u002Fstrong><span style=\"color:#4d5a78;margin-left:16px\"><em>missing at random<\u002Fem><\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px;border-bottom:2px solid #d4d7de\">solo dalle parti <strong>osservate<\u002Fstrong> di <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">X<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:14px 0 14px 22px;border-bottom:2px solid #d4d7de\">il panel di esami di laboratorio dipende dal reparto,<br>che è registrato<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px 14px 0;border-bottom:2px solid #d4d7de\"><strong>MNAR<\u002Fstrong><span style=\"color:#4d5a78;margin-left:16px\"><em>missing not at random<\u002Fem><\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px;border-bottom:2px solid #d4d7de\">anche dalle parti <strong>non osservate<\u002Fstrong> di <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">X<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:14px 0 14px 22px;border-bottom:2px solid #d4d7de\">l'esame non è stato chiesto perché il paziente appariva sano<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px 14px 0;border-bottom:2px solid #d4d7de\">self-masking<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:14px 22px;border-bottom:2px solid #d4d7de\">dal valore <strong>stesso<\u002Fstrong> che manca<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:14px 0 14px 22px;border-bottom:2px solid #d4d7de\">caso particolare di MNAR, il più frequente in clinica<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:10px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:40px;font-weight:700;line-height:1.3\"><strong>La distinzione non è verificabile dai dati.<\u002Fstrong> Da un dataset non si può dimostrare che il meccanismo sia MAR: è un'ipotesi sul processo clinico.<\u002Fp><\u002Fdiv><div style=\"border-top:2px solid #d4d7de;padding-top:16px;margin-top:24px;font-size:25px;color:#3f4a63;line-height:1.4\">Terminologia introdotta da Rubin (1976); la trattazione moderna in predizione è in Josse et al., <em>On the consistency of supervised learning with missing values<\u002Fem>, Statistical Papers 2024.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"16 definizione · missingness informativa\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:76px 110px 56px;box-sizing:border-box\" data-om-slide-id=\"1301ad92\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Missingness informativa e self-masking<\u002Fh2>\n  <div style=\"background:#dfe9ff;padding:40px 48px;max-width:1660px\" data-enter=\"rise\"><p style=\"margin:0;font-size:56px;font-weight:700;line-height:1.3;letter-spacing:-1px\">La missingness è <strong>informativa<\u002Fstrong> quando la maschera <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:.9em\">M<\u002Fspan> porta informazione sull'esito che i valori osservati non contengono già.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1520px;margin-top:40px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">il predittore ottimo dipende <strong>dalla maschera oltre che dai valori<\u002Fstrong><\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">i pattern di missingness possibili sono <span style=\"font-family: Consolas, Menlo, &quot;DejaVu Sans Mono&quot;, monospace; font-size: 0.9em;\">2^p<\u002Fspan>: costruire un metodo che li tratta separatamente è infattibile<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">l'informazione contenuta nella maschera riguarda <strong>il comportamento del clinico<\u002Fstrong><\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:20px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3;max-width:1520px\">Conseguenza in production: la maschera di missingness dipende dal protocollo clinico, che è soggetto a drift.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"17 grafico · sbilanciamento\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"9292b477\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 32px;max-width:1560px\">Sbilanciamento delle classi<\u002Fh2>\n  <div style=\"display:flex;gap:56px;align-items:flex-start\" data-enter=\"rise\"><div style=\"flex:0 0 860px;max-width:860px\"><div style=\"display:flex;flex-direction:column;gap:14px;width:100%\"><svg sc-camel-view-box=\"0 0 860 460\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M120 303 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M120 206 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M120 108 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M120 400 V 30 H 840\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><rect x=\"210\" y=\"56\" width=\"190\" height=\"344\" fill=\"#14213d\"><\u002Frect><rect x=\"560\" y=\"378\" width=\"190\" height=\"22\" fill=\"#2f6bff\"><\u002Frect><text x=\"112\" y=\"408\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">0<\u002Ftext><text x=\"112\" y=\"311\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">1.000<\u002Ftext><text x=\"112\" y=\"214\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">2.000<\u002Ftext><text x=\"112\" y=\"116\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">3.000<\u002Ftext><text x=\"120\" y=\"22\" font-size=\"24\" text-anchor=\"middle\" fill=\"#4d5a78\">pazienti<\u002Ftext><text x=\"305\" y=\"44\" font-size=\"28\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">≈ 3.540<\u002Ftext><text x=\"655\" y=\"366\" font-size=\"28\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">≈ 230<\u002Ftext><text x=\"305\" y=\"436\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">classe negativa<\u002Ftext><text x=\"655\" y=\"436\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">classe positiva<\u002Ftext><text x=\"838\" y=\"120\" font-size=\"40\" text-anchor=\"end\" fill=\"#2f6bff\" font-weight=\"700\">≈ 15 : 1<\u002Ftext><\u002Fsvg><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:18px\">    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Nei problemi diagnostici la condizione da individuare è tipicamente presente in una frazione piccola della popolazione osservata.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>L'accuratezza diventa inutilizzabile.<\u002Fstrong><\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">L'addestramento risente della scarsità: la loss function è dominata dalla classe maggioritaria.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Il vincolo statistico è il <strong>numero di eventi positivi<\u002Fstrong>, che determina l'incertezza su ogni metrica.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"18 colonne · costo asimmetrico\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"84f7e4b0\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Costo asimmetrico degli errori<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:70px;align-items:start\" data-enter=\"rise\">\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Falso negativo<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">una condizione presente non viene segnalata<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">il caso non viene approfondito<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">il costo è clinico (ritardo nel trattamento) e differito nel tempo<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">spesso non viene mai osservato<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Falso positivo<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">un paziente sano viene inviato ad approfondimento<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">costo economico, di tempo e di ansia<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">il costo è immediato e misurabile<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">viene sempre osservato<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3\">Il rapporto fra i due costi è definito dalle soglie scelte in fase di calibrazione dei modelli, ed è dettato anche da considerazioni cliniche.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"20 elenco · leakage\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"7d5d45a9\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Data leakage nei dati clinici<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Definizione.<\u002Fstrong> Una variabile disponibile in addestramento che in produzione non esiste, o che contiene informazione ottenuta a valle del fenomeno da predire.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Variabili post-evento<\u002Fstrong>: terapie iniziate dopo la diagnosi, codici di dimissione, successivi accertamenti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Variabili di processo<\u002Fstrong>: reparto di provenienza, tipo di richiesta, urgenza. Codificano il <strong>sospetto già formulato dal clinico<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>La maschera di missingness stessa<\u002Fstrong>, quando l'esame è stato prescritto proprio perché esisteva un sospetto clinico.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3\">In molti casi la mitigazione dei leakage può avvenire solo tramite ricostruzione del flusso di raccolta dei dati, e valutazione delle singole variabili con supporto di esperti di dominio.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"21 elenco · numerosità eventi\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"d48fd896\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Numerosità limitata degli eventi<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Nei modelli di predizione clinica il campione utile non si conta in righe: si conta in <strong>eventi<\u002Fstrong>, cioè casi della classe minoritaria.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Da lì dipende l'incertezza su ogni stima: metriche, coefficienti, forma delle funzioni apprese.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Con poche decine di eventi, l'intervallo di confidenza su una metrica può essere più largo della differenza fra due modelli che si vogliono confrontare.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Le regole empiriche storiche — dieci eventi per variabile, cento eventi per una validazione — sono state mostrate inaffidabili e sostituite da calcoli mirati.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3;max-width:1520px\">Il dimensionamento del campione chiude il Passo 4, ed è la stessa questione vista dal lato della progettazione anziché da quello della misura.<\u002Fp><div style=\"border-top:2px solid #d4d7de;padding-top:16px;margin-top:24px;font-size:27px;color:#3f4a63;line-height:1.4\">Riley et al., <em>Minimum sample size for external validation of a clinical prediction model with a binary outcome<\u002Fem>, Statistics in Medicine 2021.<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"22 divisoria · Passo 2\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"45e8d0b4\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 2<\u002Fp>\n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Costruzione e preprocessing dei dati<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"23 tabella · tipi di variabile\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"b372ae56\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Tipi di variabile e loro trattamento<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">tipo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">esempi<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">trattamento<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">continua misurata<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">valore somministrato di un farmaco<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">standardizzazione, oppure nessun preprocessing (se il modello è ad albero)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">continua derivata<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">rapporto fra due valori di laboratorio<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">ricalcolata, se necessario<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">categorica ordinale<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">classe di severità<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">codifica che conserva l'ordine<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">categorica nominale<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">struttura di provenienza<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">one-hot<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">binaria<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">terapia in corso, sesso<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">nessuno<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">indicatore di esecuzione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">l'esame è stato eseguito<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">nessuno (la maschera di missingness)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Le variabili derivate vanno <strong>ricalcolate dopo<\u002Fstrong> l'imputazione, non imputate: un rapporto imputato non è coerente con i suoi ingressi e introduce contraddizioni che il modello impara.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"24 tabella · panoramica missing\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:56px 110px 44px;box-sizing:border-box\" data-om-slide-id=\"25e417be\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Trattamento dei valori mancanti: panoramica<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">famiglia<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">esempi<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">che cosa assume<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">costo<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">cancellazione dei casi<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">complete-case analysis<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">che i casi completi siano rappresentativi<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">perdita di dati, distorsione<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">imputazione con costante<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">media, mediana, valore fisso<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">che il modello a valle sia flessibile<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">nullo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">imputazione multipla<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">MICE, imputazione iterativa<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">un modello per colonna a partire dalle altre<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">alto, e va replicata in inferenza<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">basata sui vicini<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">kNN imputer<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">che la somiglianza sulle colonne presenti basti<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">alto in inferenza<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">indicatore di missingness<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">colonna binaria aggiuntiva<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">che l'assenza porti informazione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">nullo, ma fragile<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">gestione nativa nel modello<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">alberi con MIA<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">niente: l'assenza è una direzione dello split<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">nullo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">modelli per pattern<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">pattern submodels<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">un modello per ogni pattern osservato<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">esponenziale<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">architetture dedicate<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">NeuMiss<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">una forma parametrica del predittore ottimo<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">implementativo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:16px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:36px;font-weight:700;line-height:1.3\">Nessuna riga di questa tabella è «la soluzione corretta». La scelta dipende dal meccanismo assunto e dal costo che si può sostenere in inferenza, non da un confronto di accuratezza.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n<section data-label=\"27 elenco · indicatori di missingness\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"35712247\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Indicatori di missingness<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Costruzione.<\u002Fstrong> Per ogni variabile che può mancare si aggiunge una colonna binaria che dice se il valore è presente. Il modello riceve valori e maschera insieme.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Quando aiuta.<\u002Fstrong> Quando la missingness è informativa: l'indicatore è il canale attraverso cui l'informazione arriva al modello.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Quando è ridondante.<\u002Fstrong> Quando il modello gestisce già i valori assenti nativamente: l'indicatore duplica un'informazione che il modello ha già.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Perché è fragile.<\u002Fstrong> L'indicatore codifica una <strong>prassi operativa<\u002Fstrong>. Se il protocollo di prescrizione cambia, la regola appresa diventa falsa, e le metriche calcolate sul vecchio test set restano buone.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">In letteratura clinica il bilancio è controverso: alcuni studi riportano un guadagno in scenari MNAR, altri nessuna differenza, e tutti segnalano il rischio di generalizzazione fra contesti diversi.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"28 diagramma · alberi con MIA\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:80px 110px 60px;box-sizing:border-box\" data-om-slide-id=\"28fa91c7\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 24px;max-width:1560px\">Alberi con MIA<\u002Fh2>\n  <p style=\"margin:0 0 34px;font-size:32px;line-height:1.35;max-width:1620px\">A ogni split, l'albero decide dove mandare i record in cui quella variabile manca. Ha tre possibilità.<\u002Fp>\n  <div style=\"display:flex;gap:32px;justify-content:flex-start\" data-enter=\"rise\"><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:26px 24px;width:452px;box-sizing:border-box\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:20px\">assenti a sinistra<\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:14px;padding:14px 18px;font-size:28px;font-weight:700;text-align:center;white-space:nowrap\">valore ≤ soglia?<\u002Fdiv><svg sc-camel-view-box=\"0 0 340 56\" style=\"width:340px;height:56px;display:block\"><path d=\"M170 0 V22 M62 22 H278 M62 22 V56 M278 22 V56\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:38px\"><div style=\"background:#2f6bff;color:#ffffff;border:3px solid #2f6bff;border-radius:12px;padding:12px 6px;font-size:26px;font-weight:700;text-align:center;width:150px;box-sizing:border-box\">bassi<br>+ assenti<\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:12px 6px;font-size:26px;text-align:center;width:150px;box-sizing:border-box\">alti<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:26px 24px;width:452px;box-sizing:border-box\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:20px\">assenti a destra<\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:14px;padding:14px 18px;font-size:28px;font-weight:700;text-align:center;white-space:nowrap\">valore ≤ soglia?<\u002Fdiv><svg sc-camel-view-box=\"0 0 340 56\" style=\"width:340px;height:56px;display:block\"><path d=\"M170 0 V22 M62 22 H278 M62 22 V56 M278 22 V56\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:38px\"><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:12px 6px;font-size:26px;text-align:center;width:150px;box-sizing:border-box\">bassi<\u002Fdiv><div style=\"background:#2f6bff;color:#ffffff;border:3px solid #2f6bff;border-radius:12px;padding:12px 6px;font-size:26px;font-weight:700;text-align:center;width:150px;box-sizing:border-box\">alti<br>+ assenti<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:26px 24px;width:452px;box-sizing:border-box\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:20px\">ramo proprio<\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:14px;padding:14px 18px;font-size:28px;font-weight:700;text-align:center;white-space:nowrap\">valore ≤ soglia?<\u002Fdiv><svg sc-camel-view-box=\"0 0 340 56\" style=\"width:340px;height:56px;display:block\"><path d=\"M170 0 V22 M40 22 H300 M40 22 V56 M170 22 V56 M300 22 V56\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:12px\"><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:12px 6px;font-size:26px;text-align:center;width:150px;box-sizing:border-box\">bassi<\u002Fdiv><div style=\"background:#2f6bff;color:#ffffff;border:3px solid #2f6bff;border-radius:12px;padding:12px 6px;font-size:26px;font-weight:700;text-align:center;width:150px;box-sizing:border-box\">assenti<\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:12px 6px;font-size:26px;text-align:center;width:150px;box-sizing:border-box\">alti<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1620px;margin-top:38px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">La scelta è <strong>appresa<\u002Fstrong>: vince quella che riduce di più la funzione di costo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Vale split per split, quindi la stessa variabile può mandare gli assenti a sinistra in un nodo e a destra in un altro.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3\"><strong>MIA — Missing Incorporated in Attribute.<\u002Fstrong> L'albero non «gestisce» i valori assenti: <strong>li usa come informazione.<\u002Fstrong><\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"30 diagramma · training e inferenza\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:66px 110px 40px;box-sizing:border-box\" data-om-slide-id=\"ada40a5b\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:32px 0 20px;max-width:1560px\">Valori mancanti in addestramento e in inferenza<\u002Fh2>\n  <div style=\"flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 0\" data-enter=\"rise\"><div style=\"display:flex;align-items:center;gap:46px\"><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:22px 24px;width:360px\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:16px\">training set<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px
