border-bottom:2px solid #d4d7de\">effetto di un intervento, non predizione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">letteratura su inferenza causale<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">fairness e disparità di sottogruppo<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">equità delle prestazioni fra popolazioni<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">letteratura dedicata<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"58 divisoria · Passo 3.5\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"59757b78\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 3.5<\u002Fp>\n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Interpretabilità<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"59 colonne · globale e locale\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"2d6eab81\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Interpretabilità globale e locale<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:70px;align-items:start\" data-enter=\"rise\">\n    <div>\n      <div style=\"font-size:36px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Globale<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">descrive il comportamento del modello nel suo insieme<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">quali variabili hanno maggior impatto, e in quale direzione<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">serve alla validazione, alla documentazione, al confronto con la conoscenza di dominio<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">non dipende dal singolo record<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:36px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Locale<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">spiega <strong>una<\u002Fstrong> predizione<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">serve durante l'uso clinico, davanti a un caso concreto<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">varia da caso a caso, e la sua stabilità va valutata<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"61 grafico · shape function\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:82px 110px 66px;box-sizing:border-box\" data-om-slide-id=\"61bb2d04\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 26px;max-width:1560px\">Lettura di una shape function<\u002Fh2>\n  <div style=\"display:flex;gap:56px;align-items:center\" data-enter=\"rise\">\n    <div style=\"flex:0 0 1000px;max-width:1000px\"><div style=\"display:flex;flex-direction:column;gap:14px;width:100%\"><svg sc-camel-view-box=\"0 0 860 470\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M138 40 V 340\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M138 220 H 840\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"844\" y=\"214\" font-size=\"26\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">0<\u002Ftext><path d=\"M150 276 C 260 270, 340 232, 430 186 C 530 138, 620 108, 828 76\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><rect x=\"150\" y=\"416\" width=\"54\" height=\"14\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"212\" y=\"390\" width=\"54\" height=\"40\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"274\" y=\"364\" width=\"54\" height=\"66\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"336\" y=\"372\" width=\"54\" height=\"58\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"398\" y=\"392\" width=\"54\" height=\"38\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"460\" y=\"406\" width=\"54\" height=\"24\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"522\" y=\"415\" width=\"54\" height=\"15\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"584\" y=\"420\" width=\"54\" height=\"10\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"646\" y=\"423\" width=\"54\" height=\"7\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"708\" y=\"425\" width=\"54\" height=\"5\" fill=\"#c9d9ff\"><\u002Frect><rect x=\"770\" y=\"426\" width=\"54\" height=\"4\" fill=\"#c9d9ff\"><\u002Frect><path d=\"M150 430 H 840\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"138\" y=\"22\" font-size=\"26\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">contributo al logit<\u002Ftext><text x=\"150\" y=\"462\" font-size=\"24\" text-anchor=\"start\" fill=\"#4d5a78\">numero di casi per intervallo<\u002Ftext><text x=\"840\" y=\"258\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">valore dell'analita<\u002Ftext><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">L'asse verticale è il <strong>contributo al logit<\u002Fstrong>. Sopra lo zero la variabile aumenta il rischio, sotto lo riduce.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">La <strong>pendenza<\u002Fstrong> dice dove il rischio cambia più in fretta; i tratti piatti sono intervalli in cui il valore non fa differenza.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">L'istogramma dà il <strong>numero di casi per intervallo<\u002Fstrong>. Dove è basso — tipicamente le code — la curva è stimata su pochi dati.<\u002Fp><\u002Fdiv>\n    \n    \n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:30px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:36px;font-weight:700;line-height:1.3;max-width:1560px\">La curva <strong>è<\u002Fstrong> la spiegazione: non c'è un secondo modello che stima cosa il primo ha fatto.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"62 metodi post-hoc\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:78px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"62d0aa31\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 26px;max-width:1560px\">Metodi post-hoc<\u002Fh2>\n  <p style=\"margin:0 0 30px;font-size:36px;line-height:1.35;max-width:1660px\">Si applicano a modelli già addestrati, senza toccarli: si osserva <strong>come si comporta<\u002Fstrong> cambiando gli ingressi e osservando le uscite (black box).<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1620px;margin-top:0px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Il vantaggio.<\u002Fstrong> Si applicano a qualunque modello, anche a uno che non è stato progettato per essere leggibile.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Il limite.<\u002Fstrong> Producono una <strong>stima<\u002Fstrong> del comportamento del modello, non il comportamento stesso (stima soggetta a errori).<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px;margin-top:40px;padding-top:30px;border-top:3px solid #14213d\" data-enter=\"rise\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">i tre che vediamo<\u002Fdiv><div style=\"display:flex;gap:22px;align-items:baseline\"><div style=\"font-size:32px;font-weight:700;color:#2f6bff;width:56px;flex-shrink:0\">1<\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Permutation importance<\u002Fstrong> — quanto il modello stimatore si appoggia a una variabile<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:22px;align-items:baseline\"><div style=\"font-size:32px;font-weight:700;color:#2f6bff;width:56px;flex-shrink:0\">2<\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Partial dependence<\u002Fstrong> — l'effetto medio di una variabile sulle predizioni<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:22px;align-items:baseline\"><div style=\"font-size:32px;font-weight:700;color:#2f6bff;width:56px;flex-shrink:0\">3<\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>SHAP<\u002Fstrong> — il contributo di ogni variabile a una singola predizione<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:32px;font-weight:700;line-height:1.3\">Esistono altri metodi — LIME, controfattuali, ICE — che rispondono a domande simili con gli stessi limiti.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"63 permutation e PD\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:74px 110px 50px;box-sizing:border-box\" data-om-slide-id=\"63e7c220\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 22px;max-width:1560px\">Permutation e partial dependence<\u002Fh2>\n  <div style=\"display:flex;gap:44px;align-items:center;margin-top:4px\" data-enter=\"rise\"><div><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">4,2<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">1,8<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">9,1<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0\"><div style=\"font-size:26px;color:#4d5a78\">shuffle<\u002Fdiv><div style=\"display:flex;align-items:center;width:110px\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;background:#2f6bff;color:#ffffff;font-weight:700\">9,1<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;background:#2f6bff;color:#ffffff;font-weight:700\">3,0<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;background:#2f6bff;color:#ffffff;font-weight:700\">1,8<\u002Fdiv><div style=\"width:88px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;box-sizing:border-box;border:2px solid #d4d7de\">…<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:30px;line-height:1.35;max-width:640px;color:#14213d\">Gli stessi valori, assegnati ad altri pazienti: la colonna resta plausibile ma <strong>perde ogni legame con l'esito<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:18px;max-width:1620px;margin-top:30px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Permutation importance.<\u002Fstrong> Si rimescolano i valori di una colonna fra le righe e si misura di quanto peggiora la metrica. Se peggiora molto, il modello si appoggiava a quella variabile.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Se due variabili sono fortemente correlate, rimescolandone una il modello potrebbe recuperare l'informazione dall'altra: la metrica non cala e sembrano entrambe inutili.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Partial dependence.<\u002Fstrong> Si fissa una variabile a un valore, si predice su tutti i pazienti, si fa la media; ripetendo su una griglia di valori si ottiene la curva dell'effetto medio. Problema: si costruiscono esempi out-of-distribution.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:24px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"65 Shapley e SHAP\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:66px 110px 44px;box-sizing:border-box\" data-om-slide-id=\"65f1b806\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 18px;max-width:1560px\">Valori di Shapley e SHAP<\u002Fh2>\n  <p style=\"margin:0 0 18px;font-size:32px;line-height:1.35;max-width:1680px\">Il modello predice <strong>0,36<\u002Fstrong> per questo paziente e in media <strong>0,06<\u002Fstrong>: SHAP <strong>distribuisce la differenza<\u002Fstrong> fra le variabili. Ogni barra parte dove finisce la precedente.<\u002Fp>\n  <div data-enter=\"rise\"><svg sc-camel-view-box=\"-330 0 2100 320\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M150 20 V 300\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M711.6 20 V 312\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"3\" stroke-dasharray=\"10 8\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><rect x=\"150\" y=\"30\" width=\"94\" height=\"30\" fill=\"#14213d\"><\u002Frect><text x=\"134\" y=\"53\" font-size=\"30\" text-anchor=\"end\" fill=\"#14213d\" font-weight=\"700\">media del modello<\u002Ftext><text x=\"259.6\" y=\"53\" font-size=\"30\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">0,06<\u002Ftext><rect x=\"244\" y=\"78\" width=\"156\" height=\"30\" fill=\"#2f6bff\"><\u002Frect><text x=\"134\" y=\"101\" font-size=\"30\" text-anchor=\"end\" fill=\"#4d5a78\">età<\u002Ftext><text x=\"321.6\" y=\"101\" font-size=\"30\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">+0,10<\u002Ftext><rect x=\"400\" y=\"126\" width=\"218\" height=\"30\" fill=\"#2f6bff\"><\u002Frect><text x=\"134\" y=\"149\" font-size=\"30\" text-anchor=\"end\" fill=\"#4d5a78\">analita A<\u002Ftext><text x=\"508.8\" y=\"149\" font-size=\"30\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">+0,14<\u002Ftext><rect x=\"618\" y=\"174\" width=\"140\" height=\"30\" fill=\"#2f6bff\"><\u002Frect><text x=\"134\" y=\"197\" font-size=\"30\" text-anchor=\"end\" fill=\"#4d5a78\">analita B<\u002Ftext><text x=\"688.2\" y=\"197\" font-size=\"30\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">+0,09<\u002Ftext><rect x=\"712\" y=\"222\" width=\"47\" height=\"30\" fill=\"#8b96ad\"><\u002Frect><text x=\"134\" y=\"245\" font-size=\"30\" text-anchor=\"end\" fill=\"#4d5a78\">terapia<\u002Ftext><text x=\"695.6\" y=\"245\" font-size=\"30\" text-anchor=\"end\" fill=\"#14213d\" font-weight=\"700\">−0,03<\u002Ftext><rect x=\"150\" y=\"270\" width=\"562\" height=\"30\" fill=\"#14213d\"><\u002Frect><text x=\"134\" y=\"293\" font-size=\"30\" text-anchor=\"end\" fill=\"#14213d\" font-weight=\"700\">questo paziente<\u002Ftext><text x=\"727.6\" y=\"293\" font-size=\"30\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">0,36<\u002Ftext><\u002Fsvg><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1680px;margin-top:20px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il contributo è quanto la variabile <strong>sposta la predizione<\u002Fstrong> quando viene aggiunta alle altre, mediato su <strong>tutti gli ordini<\u002Fstrong> di aggiunta possibili. Sommati, ricostruiscono esattamente lo scarto dalla media.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il calcolo esatto costa 2<sup style=\"font-size:.8em\">p<\u002Fsup> valutazioni. Sugli alberi esiste <strong>TreeSHAP<\u002Fstrong>, che lo risolve in tempo polinomiale: è la ragione per cui SHAP è diventato lo standard sui dati tabellari.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">TreeSHAP ha però <strong>due varianti<\u002Fstrong> — <em>conditional<\u002Fem> e <em>interventional<\u002Fem> — che simulano in modo diverso l'assenza di una variabile e danno risultati diversi sullo stesso modello. La libreria sceglie in base agli argomenti che le si passano: va dichiarato quale si è usata.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:24px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:22px 30px\"><p style=\"margin:0;font-size:32px;font-weight:700;line-height:1.3\">Le proprietà valgono per i valori esatti; con l'approssimazione valgono in modo approssimato.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n<section data-label=\"68 diagramma · disaccordo\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"4f2edf40\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 26px;max-width:1560px\">Disaccordo fra metodi di spiegazione<\u002Fh2>\n  <div style=\"flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0;overflow:hidden\" data-enter=\"rise\"><div style=\"display:flex;align-items:center;gap:10px\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:250px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">un modello<\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 90 400\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:90px;height:210px;display:block\"><path d=\"M0 200 H40 M40 30 V370 M40 30 H90 M40 143 H90 M40 257 H90 M40 370 H90\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;align-items:center;gap:26px\"><div style=\"text-align:center\"><div style=\"font-size:24px;color:#4d5a78;margin-bottom:10px\">metodo A<\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:12px;padding:14px 18px;font-size:26px;line-height:1.45;color:#14213d\">1 x_3<br>2 x_1<br>3 x_7<br>4 x_2<\u002Fdiv><\u002Fdiv><div style=\"text-align:center\"><div style=\"font-size:24px;color:#4d5a78;margin-bottom:10px\">metodo B<\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:12px;padding:14px 18px;font-size:26px;line-height:1.45;color:#14213d\">1 x_1<br>2 x_3<br>3 x_2<br>4 x_7<\u002Fdiv><\u002Fdiv><div style=\"text-align:center\"><div style=\"font-size:24px;color:#4d5a78;margin-bottom:10px\">metodo C<\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:12px;padding:14px 18px;font-size:26px;line-height:1.45;color:#14213d\">1 x_7<br>2 x_3<br>3 x_1<br>4 x_5<\u002Fdiv><\u002Fdiv><div style=\"text-align:center\"><div style=\"font-size:24px;color:#4d5a78;margin-bottom:10px\">metodo D<\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:12px;padding:14px 18px;font-size:26px;line-height:1.45;color:#14213d\">1 x_3<br>2 x_2<br>3 x_5<br>4 x_1<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1620px;margin-top:30px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Metodi diversi applicati allo stesso modello producono ordinamenti diversi, e la discordanza cresce con la correlazione fra le variabili.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\"><strong>Non esiste una ground truth<\u002Fstrong>: l'importanza reale di una variabile non è una quantità osservabile, quindi non si può stabilire quale metodo sbagli.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Il fenomeno è documentato in modo sistematico e riguarda anche coppie di metodi che misurano nominalmente la stessa cosa.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3\">Conseguenza operativa: l'attribuzione serve a <strong>generare ipotesi da verificare<\u002Fstrong> con un esperimento o con la conoscenza di dominio, mai come prova a sostegno di una conclusione.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"70 tabella · destinatari\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"cf71d7e5\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;l w-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">«perché sono stato segnalato?»<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">poche frasi in linguaggio naturale<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">su richiesta<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">ente regolatore<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">«quali variabili sono state usate?»<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">descrizione globale, documentazione del modello<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">in fase di approvazione<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">sviluppatore<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">«dove sbaglia?»<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">analisi degli errori, casi limite, stabilità<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">in fase di sviluppo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"71 divisoria · Passo 4\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"174bf0c2\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 4<\u002Fp>\n    <h2 style=\"margin:0;font-size:128px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Valutazione: metriche, calibrazione, incertezza<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"72 tabella · metriche binarie\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:74px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"d9c28789\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Metriche di classificazione binaria<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">metrica<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">INTERPRETAZIONE<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">quando è fuorviante<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">accuratezza<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">frazione di predizioni corrette<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">classi sbilanciate: la si massimizza rispondendo sempre «negativo»<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">recall<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">quota di positivi individuati<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">da sola non dice quanti falsi positivi costa<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">specificità<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">quota di negativi riconosciuti<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">a bassa prevalenza è quasi sempre altissima<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">precision<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">quota di segnalazioni corrette<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">dipende dalla prevalenza, quindi non trasferisce fra popolazioni<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">F1<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">media armonica di precision e recall<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">pesa recall e precision in modo simmetrico<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">AUROC<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">probabilità di ordinare correttamente una coppia<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">non dice niente sulla calibrazione<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:16px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"73 elenco · metriche sbilanciate\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"73aa10c2\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 44px;max-width:1560px\">Metriche su classi sbilanciate<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px;margin-top:0px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>L'accuracy non è informativa.<\u002Fstrong> Con prevalenza al 6 % un classificatore che predice sempre la classe negativa raggiunge il 94 %.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>La baseline della curva precision-recall è la prevalenza<\u002Fstrong>, non 0,5. Un'average precision di 0,30 con prevalenza 0,06 corrisponde a un fattore cinque sul caso.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>La precision dipende dalla prevalenza<\u002Fstrong>, quindi non si trasferisce fra popolazioni: a soglia invariata, lo stesso modello ha precision diversa in un contesto con prevalenza diversa.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Sensibilità e specificità si trasferiscono<\u002Fstrong>, essendo condizionate alla classe vera. Per questo la letteratura clinica le riporta come descrittori primari.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Un valore di average precision va sempre riportato <strong>insieme alla prevalenza<\u002Fstrong> del campione su cui è calcolato.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"74 grafico · ROC e PR\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 56px;box-sizing:border-box\" data-om-slide-id=\"ad4525ab\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 28px;max-width:1560px\">Curva ROC e curva precision-recall<\u002Fh2>\n  <div data-enter=\"rise\"><div style=\"display:flex;align-items:start;gap:60px\"><div style=\"display:flex;flex-direction:column;gap:14px;flex:1 1 0;min-width:0\"><svg sc-camel-view-box=\"0 0 780 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M120 360 V 30 H 760\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M132 360 L752 40\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"3\" stroke-dasharray=\"12 10\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M132 356 C 200 180, 300 100, 440 74 C 560 52, 660 46, 752 42\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"120\" y=\"22\" font-size=\"24\" text-anchor=\"middle\" fill=\"#4d5a78\">sensibilità<\u002Ftext><text x=\"752\" y=\"396\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">1 − specificità<\u002Ftext><text x=\"440\" y=\"140\" font-size=\"34\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">ROC<\u002Ftext><\u002Fsvg><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;flex:1 1 0;min-width:0\"><svg sc-camel-view-box=\"0 0 780 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M120 360 V 30 H 760\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M132 330 H752\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"3\" stroke-dasharray=\"12 10\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"756\" y=\"324\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">prevalenza<\u002Ftext><path d=\"M132 90 C 260 120, 360 190, 480 250 C 600 305, 690 330, 752 340\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"120\" y=\"22\" font-size=\"24\" text-anchor=\"middle\" fill=\"#4d5a78\">precisione<\u002Ftext><text x=\"752\" y=\"396\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">recall<\u002Ftext><text x=\"480\" y=\"140\" font-size=\"34\" text-anchor=\"middle\" fill=\"#2f6bff\" font-weight=\"700\">precision-recall<\u002Ftext><\u002Fsvg><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:30px;max-width:1620px\" data-enter=\"rise\"><div style=\"display:flex;flex-direction:column;gap:18px\">    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>La ROC<\u002Fstrong> divide i falsi positivi per tutti i negativi: a bassa prevalenza sono moltissimi.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>La precision-recall<\u002Fstrong> li divide per le segnalazioni fatte: lo stesso peggioramento si vede.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:30px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.3\">Non è che una curva sia giusta e l'altra sbagliata: rispondono a due domande. <strong>A bassa prevalenza, l'impressione che danno è molto diversa.<\u002Fstrong><\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"75 elenco · soglia operativa\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"75b3ce41\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 44px;max-width:1560px\">Scelta della soglia operativa<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px;margin-top:0px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Il modello restituisce un punteggio continuo<\u002Fstrong>; la decisione binaria richiede una soglia, che non fa parte dell'addestramento ed è una scelta a valle.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Precision a recall fissato.<\u002Fstrong> È la forma in cui il requisito arriva dal clinico: fissata la sensibilità richiesta, si misura il volume di falsi positivi che ne consegue.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Massimizzare F1 è una scelta implicita.<\u002Fstrong> Fissa un rapporto fra i costi dei due errori uguale per ogni contesto, senza dichiararlo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>La soglia è legata alla popolazione.<\u002Fstrong> A prevalenza diversa, la stessa soglia produce un punto di lavoro diverso, e va rivista.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">La soglia si deriva dal rapporto fra i costi dei due errori, che si formalizza con gli strumenti di utilità clinica alla fine del passo.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"76 grafico · intervalli\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"0b12fc9c\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 36px;max-width:1560px\">Intervalli di confidenza sulle metriche<\u002Fh2>\n  <div style=\"display:flex;gap:56px;align-items:center\" data-enter=\"rise\"><div style=\"flex:0 0 880px;max-width:880px\"><svg sc-camel-view-box=\"0 0 860 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M240 340 V 30 H 840\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M310 140 H640\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M310 112 V168 M640 112 V168\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><circle cx=\"470\" cy=\"140\" r=\"12\" fill=\"#14213d\"><\u002Fcircle><path d=\"M400 250 H730\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M400 222 V278 M730 222 V278\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><circle cx=\"560\" cy=\"250\" r=\"12\" fill=\"#2f6bff\"><\u002Fcircle><rect x=\"400\" y=\"100\" width=\"240\" height=\"190\" fill=\"#2f6bff\" opacity=\"0.10\"><\u002Frect><text x=\"520\" y=\"332\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">gli intervalli si sovrappongono<\u002Ftext><text x=\"228\" y=\"148\" font-size=\"28\" text-anchor=\"end\" fill=\"#14213d\" font-weight=\"700\">modello A<\u002Ftext><text x=\"228\" y=\"258\" font-size=\"28\" text-anchor=\"end\" fill=\"#2f6bff\" font-weight=\"700\">modello B<\u002Ftext><text x=\"840\" y=\"376\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">valore della metrica<\u002Ftext><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">La metrica calcolata su un test set è una <strong>stima<\u002Fstrong>, e dipende da quello specifico test set.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Il <strong>bootstrap<\u002Fstrong> — resampling con reimmissione delle righe del test set — dà un intervallo di confidenza attorno alla stima.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">L'intervallo dice <strong>se il confronto è possibile<\u002Fstrong>. Se gli intervalli dei due modelli si sovrappongono, il confronto è poco informativo.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"77 tabella · confronto modelli\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"7e68baae\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Confronto fra due modelli<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">approccio<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">procedura<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">quando usarlo<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">confronto di intervalli separati<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">si guardano i due intervalli e si controlla se si sovrappongono<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\"><strong>da evitare<\u002Fstrong>: ignora che i modelli sono valutati sugli stessi casi ed è troppo conservativo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">bootstrap sulla differenza appaiata<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">a ogni resampling si calcolano entrambe le metriche e si prende la differenza<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">confronto fra metriche continue sullo stesso test set<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">test di McNemar<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">tabella delle discordanze fra le due decisioni binarie<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">confronto fra decisioni a soglia fissata<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">validazione ripetuta<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">si ripete l'intero protocollo su split diversi<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">quando il test set è piccolo e si può ricampionare l'addestramento<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"78 definizione · calibrazione\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 58px;box-sizing:border-box\" data-om-slide-id=\"8ecd5ea3\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Calibrazione: definizione<\u002Fh2>\n  <div style=\"background:#dfe9ff;padding:40px 48px;max-width:1660px\" data-enter=\"rise\"><p style=\"margin:0;font-size:50px;font-weight:700;line-height:1.3;letter-spacing:-1px\">Un modello è <strong>calibrato<\u002Fstrong> quando, fra tutti i casi ai quali assegna probabilità <span style=\"font-family: Consolas, Menlo, &quot;DejaVu Sans Mono&quot;, monospace; font-size: 0.9em;\">p<\u002Fspan>, la frazione di positivi osservata è <span style=\"font-family: Consolas, Menlo, &quot;DejaVu Sans Mono&quot;, monospace; font-size: 0.9em;\">p<\u002Fspan>. Questo deve valere per ogni valore di&nbsp;<span style=\"font-family: Consolas, Menlo, &quot;DejaVu Sans Mono&quot;, monospace; font-size: 0.9em;\">p<\u002Fspan>.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1520px;margin-top:40px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\"><strong>in media<\u002Fstrong> — la media delle probabilità predette uguaglia la prevalenza osservata<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\"><strong>debole<\u002Fstrong> — pendenza di calibrazione pari a 1 e intercetta pari a 0<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\"><strong>moderata<\u002Fstrong> — la definizione qui sopra, per ogni valore di <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:.9em\">p<\u002Fspan><\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\"><strong>forte<\u002Fstrong> — la stessa proprietà <strong>dentro ogni sottogruppo<\u002Fstrong> della popolazione<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"79 grafico · reliability diagram\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:84px 110px 62px;box-sizing:border-box\" data-om-slide-id=\"79cc4b70\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 32px;max-width:1560px\">Reliability diagram<\u002Fh2>\n  <div style=\"display:flex;gap:52px;align-items:center\" data-enter=\"rise\"><div style=\"flex:0 0 900px;max-width:900px\"><svg sc-camel-view-box=\"0 0 900 445\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M150 320 H810 M150 320 V50\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M150 320 L810 50\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"3\" stroke-dasharray=\"12 10\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"812\" y=\"44\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">calibrazione perfetta<\u002Ftext><path d=\"M183 312 L249 296 L315 277 L381 261 L447 236 L513 212 L579 180 L665 153 L744 107\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><circle cx=\"183\" cy=\"312\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"249\" cy=\"296\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"315\" cy=\"277\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"381\" cy=\"261\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"447\" cy=\"236\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"513\" cy=\"212\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"579\" cy=\"180\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"665\" cy=\"153\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"744\" cy=\"107\" r=\"10\" fill=\"#14213d\"><\u002Fcircle><text x=\"140\" y=\"329\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">0<\u002Ftext><path d=\"M144 320 H150\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\"><\u002Fpath><text x=\"140\" y=\"194\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">0,5<\u002Ftext><path d=\"M144 185 H150\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\"><\u002Fpath><text x=\"140\" y=\"59\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">1<\u002Ftext><path d=\"M144 50 H150\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\"><\u002Fpath><text x=\"150\" y=\"374\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">0<\u002Ftext><text x=\"480\" y=\"374\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">0,5<\u002Ftext><text x=\"810\" y=\"374\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">1<\u002Ftext><text x=\"150\" y=\"30\" font-size=\"28\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">frazione osservata di positivi<\u002Ftext><text x=\"480\" y=\"412\" font-size=\"26\" text-anchor=\"middle\" fill=\"#4d5a78\">probabilità predetta<\u002Ftext><text x=\"640\" y=\"258\" font-size=\"28\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">il modello<\u002Ftext><text x=\"640\" y=\"292\" font-size=\"28\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">sovrastima<\u002Ftext><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Le predizioni si raggruppano in <strong>bin<\u002Fstrong>; per ciascuno si confronta la probabilità media predetta con la frazione di positivi osservata.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">La <strong>diagonale<\u002Fstrong> è la calibrazione perfetta. I punti sotto la diagonale indicano un modello che sovrastima il rischio.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Il <strong>numero e il tipo di bin<\u002Fstrong> cambiano l'aspetto del grafico, e non esiste una scelta neutra.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">A prevalenza bassa quasi tutte le predizioni cadono nei primi bin, e il resto del grafico è stimato su pochissimi casi.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.3\">Per questo la letteratura clinica non si affida all'ispezione visiva, ma a due statistiche che non dipendono dai bin.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"80 codice · pendenza e intercetta\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:74px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"cdf191dd\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Pendenza e intercetta di calibrazione<\u002Fh2>\n  <p style=\"margin:0 0 30px;font-size:30px;line-height:1.35;max-width:1620px\">Si adatta una regressione logistica che ha come unica variabile il logit delle probabilità predette, e come esito l'evento osservato.<\u002Fp>\n  <div style=\"border-radius:18px;overflow:hidden;box-shadow:0 8px 40px rgba(20,33,61,.25)\" data-enter=\"rise\">\n    <div style=\"display:flex;align-items:center;gap:16px;background:#21252b;padding:18px 28px\"><div style=\"width:22px;height:22px;border-radius:50%;background:#ff5f57\"><\u002Fdiv><div style=\"width:22px;height:22px;border-radius:50%;background:#febc2e\"><\u002Fdiv><div style=\"width:22px;height:22px;border-radius:50%;background:#28c840\"><\u002Fdiv><span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:24px;color:#7f848e;margin-left:20px\">calibrazione.txt<\u002Fspan><\u002Fdiv>\n    <pre style=\"margin:0;font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:24px;line-height:1.55;color:#f8f8f2;background:#282c34;padding:30px 46px;white-space:pre-wrap\"><span style=\"color:#66d9ef\">logit<\u002Fspan> p_oss  =  a  +  b * <span style=\"color:#66d9ef\">logit<\u002Fspan> p_pred\nb = <span style=\"color:#ae81ff\">1<\u002Fspan>, a = <span style=\"color:#ae81ff\">0<\u002Fspan>   <span style=\"color:#75715e\">-&gt;  calibrato<\u002Fspan>\nb &lt; <span style=\"color:#ae81ff\">1<\u002Fspan>          <span style=\"color:#75715e\">-&gt;  predizioni troppo estreme<\u002Fspan>\nb &gt; <span style=\"color:#ae81ff\">1<\u002Fspan>          <span style=\"color:#75715e\">-&gt;  predizioni troppo compresse verso il centro<\u002Fspan>\na != <span style=\"color:#ae81ff\">0<\u002Fspan>         <span style=\"color:#75715e\">-&gt;  errore sistematico di livello: prevalenza sbagliata<\u002Fspan><\u002Fpre>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1540px;margin-top:34px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:14px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.35\"><strong>Non dipendono dai bin<\u002Fstrong>, a differenza del reliability diagram.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.35\">I due parametri separano due difetti diversi: <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">b<\u002Fspan> riguarda la dispersione, <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">a<\u002Fspan> il livello.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.35\"><strong>Calibrazione in the large<\u002Fstrong>: si fissa <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">b = 1<\u002Fspan> e si stima il solo <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:1em\">a<\u002Fspan>. È la forma che interessa quando cambia solo la prevalenza.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:16px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:44px;font-weight:700;line-height:1.3;max-width:1520px\">Sono il linguaggio standard nella letteratura sui modelli di predizione clinica, e vanno riportati entrambi.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n<section data-label=\"83 grafico · proprietà ricalibrazione\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"26c652c8\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 32px;max-width:1560px\">Proprietà della ricalibrazione<\u002Fh2>\n  <div style=\"display:flex;gap:56px;align-items:flex-start\" data-enter=\"rise\"><div style=\"flex:0 0 860px;max-width:860px\"><div style=\"display:flex;flex-direction:column;gap:14px;width:100%\"><svg sc-camel-view-box=\"0 0 860 440\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><path d=\"M150 70 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M150 150 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><circle cx=\"230\" cy=\"70\" r=\"11\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"330\" cy=\"70\" r=\"11\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"450\" cy=\"70\" r=\"11\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"560\" cy=\"70\" r=\"11\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"740\" cy=\"70\" r=\"11\" fill=\"#14213d\"><\u002Fcircle><circle cx=\"290\" cy=\"150\" r=\"11\" fill=\"#2f6bff\"><\u002Fcircle><circle cx=\"400\" cy=\"150\" r=\"11\" fill=\"#2f6bff\"><\u002Fcircle><circle cx=\"505\" cy=\"150\" r=\"11\" fill=\"#2f6bff\"><\u002Fcircle><circle cx=\"600\" cy=\"150\" r=\"11\" fill=\"#2f6bff\"><\u002Fcircle><circle cx=\"790\" cy=\"150\" r=\"11\" fill=\"#2f6bff\"><\u002Fcircle><path d=\"M230 84 L288 136\" fill=\"none\" stroke=\"#4d5a78\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M330 84 L398 136\" fill=\"none\" stroke=\"#4d5a78\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M450 84 L503 136\" fill=\"none\" stroke=\"#4d5a78\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M560 84 L598 136\" fill=\"none\" stroke=\"#4d5a78\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M740 84 L788 136\" fill=\"none\" stroke=\"#4d5a78\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"140\" y=\"78\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">prima<\u002Ftext><text x=\"140\" y=\"158\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">dopo<\u002Ftext><path d=\"M150 300 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M150 380 H840\" fill=\"none\" stroke=\"#d4d7de\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><circle cx=\"230\" cy=\"300\" r=\"15\" fill=\"#14213d\"><\u002Fcircle><text x=\"230\" y=\"308\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">1<\u002Ftext><circle cx=\"350\" cy=\"300\" r=\"15\" fill=\"#14213d\"><\u002Fcircle><text x=\"350\" y=\"308\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">2<\u002Ftext><circle cx=\"470\" cy=\"300\" r=\"15\" fill=\"#14213d\"><\u002Fcircle><text x=\"470\" y=\"308\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">3<\u002Ftext><circle cx=\"590\" cy=\"300\" r=\"15\" fill=\"#14213d\"><\u002Fcircle><text x=\"590\" y=\"308\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">4<\u002Ftext><circle cx=\"710\" cy=\"300\" r=\"15\" fill=\"#14213d\"><\u002Fcircle><text x=\"710\" y=\"308\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">5<\u002Ftext><circle cx=\"230\" cy=\"380\" r=\"15\" fill=\"#2f6bff\"><\u002Fcircle><text x=\"230\" y=\"388\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">1<\u002Ftext><circle cx=\"350\" cy=\"380\" r=\"15\" fill=\"#2f6bff\"><\u002Fcircle><text x=\"350\" y=\"388\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">2<\u002Ftext><circle cx=\"470\" cy=\"380\" r=\"15\" fill=\"#2f6bff\"><\u002Fcircle><text x=\"470\" y=\"388\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">3<\u002Ftext><circle cx=\"590\" cy=\"380\" r=\"15\" fill=\"#2f6bff\"><\u002Fcircle><text x=\"590\" y=\"388\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">4<\u002Ftext><circle cx=\"710\" cy=\"380\" r=\"15\" fill=\"#2f6bff\"><\u002Fcircle><text x=\"710\" y=\"388\" font-size=\"24\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">5<\u002Ftext><text x=\"140\" y=\"308\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">prima<\u002Ftext><text x=\"140\" y=\"388\" font-size=\"26\" text-anchor=\"end\" fill=\"#4d5a78\">dopo<\u002Ftext><text x=\"150\" y=\"240\" font-size=\"26\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">probabilità: si spostano<\u002Ftext><text x=\"150\" y=\"430\" font-size=\"26\" text-anchor=\"start\" fill=\"#14213d\" font-weight=\"700\">ordinamento: identico<\u002Ftext><\u002Fsvg><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0\"><div style=\"display:flex;flex-direction:column;gap:18px\">    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Tutti i metodi di ricalibrazione sono <strong>trasformazioni monotone<\u002Fstrong> del punteggio.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Ne discende che <strong>l'ordinamento dei casi non cambia<\u002Fstrong>: l'AUROC e l'area sotto la curva precision-recall restano invariate.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Se il problema è la scelta di <strong>chi approfondire per primo<\u002Fstrong>, la ricalibrazione non serve a niente.<\u002Fp><\u002Fdiv>    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Se il problema è <strong>usare il valore come una probabilità<\u002Fstrong> — confrontarlo con una soglia, comunicarlo a un paziente, combinarlo con un costo — allora è indispensabile.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"84 diagramma · shift di prevalenza\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:66px 110px 40px;box-sizing:border-box\" data-om-slide-id=\"a3bea04e\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:32px 0 20px;max-width:1560px\">Shift di prevalenza<\u002Fh2>\n  <div style=\"flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 0\" data-enter=\"rise\"><div style=\"display:flex;align-items:center;gap:10px\"><div style=\"display:flex;flex-direction:column;align-items:stretch;gap:20px\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:20px 22px;text-align:center;box-sizing:border-box;width:400px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">popolazione di sviluppo<\u002Fdiv><div style=\"font-size:24px;line-height:1.25;margin-top:8px;color:#3a4a70\">la prevalenza su cui è stato stimato<\u002Fdiv><\u002Fdiv><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:20px 22px;text-align:center;box-sizing:border-box;width:400px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">popolazione di destinazione<\u002Fdiv><div style=\"font-size:24px;line-height:1.25;margin-top:8px;color:#3a4a70\">prevalenza diversa<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;width:90px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:stretch;gap:20px\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:430px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">ordinamento: invariato<\u002Fdiv><\u002Fdiv><div style=\"background:#2f6bff;color:#ffffff;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:430px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">probabilità: sistematicamente sbagliate<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1620px;margin-top:22px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">È la forma di shift più comune in ambito clinico: cambia <strong>quanto è frequente<\u002Fstrong> la condizione, non <strong>come si manifesta<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">La relazione fra variabili ed esito resta la stessa, quindi il modello continua a ordinare correttamente i pazienti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Le probabilità però sono calcolate rispetto alla vecchia prevalenza, quindi risultano sistematicamente troppo basse o troppo alte.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">La soglia scelta sulla popolazione di sviluppo produce, sulla nuova, un punto di lavoro diverso da quello previsto.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:12px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.3\">Si diagnostica con l'<strong>intercetta di calibrazione<\u002Fstrong> e con il confronto fra probabilità media predetta e prevalenza osservata. Esistono tecniche di correzione dello shift di prevalenza.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n<section data-label=\"87 colonne · incertezza\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90
