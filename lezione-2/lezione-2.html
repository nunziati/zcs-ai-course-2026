v>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Protocolli di validazione<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">protocollo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">come si costruisce<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">che cosa stima<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">hold-out singolo<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">una divisione casuale in due parti<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">stima con varianza alta, dipende dalla divisione<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">k-fold cross-validation<\u002Fsc-raw-td><sc-raw-td style=\"font-size:28px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">k divisioni, ogni parte usata una volta come test<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:  data-label=\"94 colonne · validazione esterna\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:76px 110px 56px;box-sizing:border-box\" data-om-slide-id=\"ed1dc57f\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 40px;max-width:1560px\">Validazione esterna e temporale<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:70px;align-items:start\" data-enter=\"rise\">\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Esterna, per centro<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">si addestra su alcune strutture e si valuta su una (o altre) nuova.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">cambia la popolazione, il protocollo, talvolta la strumentazione<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">il numero di centri disponibili è quasi sempre piccolo<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:40px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:26px\">Temporale<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">si addestra sui dati fino a una data e si valuta su quelli successivi<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:18px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">cambiano prassi, definizioni, popolazione afferente<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:20px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3\"><\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n\n\n\n\n\n\n\n\n<section data-label=\"101 divisoria · Passo 5\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"64a59912\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 5<\u002Fp>\n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Production e manutenzione<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"102 elenco · monitoraggio\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"d6fac874\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Monitoraggio in assenza di etichette<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Il problema.<\u002Fstrong> In un sistema clinico l'esito reale arriva mesi dopo, oppure non arriva mai, perché il paziente segnalato viene trattato e l'esito avverso non si osserva.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Drift delle variabili in ingresso.<\u002Fstrong> Distribuzione di ciascuna variabile, frazione di valori assenti, comparsa di codici nuovi. Si confronta con la distribuzione di addestramento.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Drift della distribuzione delle probabilità predette.<\u002Fstrong> È il segnale precoce di un cambio di prevalenza, e non richiede etichette: se la media delle predizioni si sposta, qualcosa è cambiato a monte.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Tasso di astensione e frazione di casi fuori distribuzione.<\u002Fstrong> Salgono prima che salgano gli errori, e sono la spia più utile fra quelle disponibili senza esiti.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Sono indicatori del fatto che le condizioni in cui è stato validato <strong>non valgono più<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n<section data-label=\"105 elenco · dispositivi medici\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"c260be14\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Regolamentazione dei dispositivi medici<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Quando un software è dispositivo medico.<\u002Fstrong> Se è destinato dal fabbricante a scopo di diagnosi, prevenzione, monitoraggio, previsione o prognosi, ricade nel regolamento europeo sui dispositivi medici. La destinazione d'uso dichiarata è il criterio.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>La classificazione.<\u002Fstrong> Il software che fornisce informazioni usate per decisioni diagnostiche o terapeutiche ricade in classi che richiedono l'intervento di un organismo notificato.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Il regolamento europeo sull'intelligenza artificiale<\u002Fstrong> classifica ad alto rischio i sistemi che sono componenti di sicurezza di un dispositivo medico, e aggiunge obblighi su gestione del rischio, qualità dei dati, documentazione tecnica e sorveglianza umana.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Le conseguenze progettuali.<\u002Fstrong> Tracciabilità delle versioni, giustificazione delle scelte di modellazione, e limiti alla possibilità di aggiornare il modello senza rivalutazione.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3\">Sono vincoli <strong>di progetto<\u002Fstrong>&nbsp;e decidono se il modello può essere aggiornato automaticamente, e talvolta quale famiglia di modelli è sostenibile.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"106 elenco · dati sanitari\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"1aa2d3cf\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Trattamento dei dati sanitari<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Categoria particolare.<\u002Fstrong> I dati relativi alla salute ricevono una tutela rafforzata: il trattamento è vietato salvo specifiche condizioni, e richiede una base giuridica adeguata.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Minimizzazione e limitazione della finalità.<\u002Fstrong> Si trattano i dati necessari allo scopo dichiarato, e non si riusano per finalità diverse senza una nuova valutazione.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Dove avviene l'elaborazione.<\u002Fstrong> Trasferire dati a un servizio esterno è un trattamento, e va valutato prima.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Anonimizzazione e pseudonimizzazione non sono la stessa cosa<\u002Fstrong>: la pseudonimizzazione da sola non esclude il rischio reidentificazione.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">La conseguenza pratica più frequente è sull'architettura: molte scelte tecniche ragionevoli diventano impraticabili se implicano che il dato esca dall'infrastruttura in cui è stato raccolto.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"107 diagramma · ruolo del modello\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:80px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"28643f2c\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 26px;max-width:1560px\">Ruolo del modello nella decisione clinica<\u002Fh2>\n  <div style=\"flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 0\" data-enter=\"rise\"><div style=\"display:grid;grid-template-columns:280px 46px 210px 46px 240px 46px 210px 46px 240px;grid-template-rows:auto 38px auto;align-items:center\"><div style=\"grid-column:1;grid-row:1\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">dati del paziente<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:2;grid-row:1\"><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:3;grid-row:1\"><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">modello<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:4;grid-row:1\"><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:5;grid-row:1\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">probabilità<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:6;grid-row:1\"><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:7;grid-row:1\"><div style=\"background:#2f6bff;color:#ffffff;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">clinico<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:8;grid-row:1\"><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:9;grid-row:1\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">decisione<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:7;grid-row:2\"><div style=\"display:flex;flex-direction:column;align-items:center;height:38px\"><div style=\"width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:16px solid #14213d\"><\u002Fdiv><div style=\"width:4px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:7;grid-row:3\"><div style=\"border:2px dashed #8b96ad;border-radius:12px;padding:14px 16px;font-size:26px;line-height:1.3;text-align:center\">informazione non<br>disponibile al modello<\u002Fdiv><\u002Fdiv><div style=\"grid-column:9;grid-row:2\"><div style=\"display:flex;flex-direction:column;align-items:center;height:38px\"><div style=\"width:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"grid-column:9;grid-row:3\"><div style=\"border:2px dashed #8b96ad;border-radius:12px;padding:14px 16px;font-size:26px;line-height:1.3;text-align:center\">responsabilità<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1620px;margin-top:22px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Il modello <strong>propone<\u002Fstrong>, il clinico decide.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">Il clinico dispone di informazioni che il modello non ha: esame obiettivo, anamnesi narrativa, contesto.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\"><strong>La soglia è una scelta clinica<\u002Fstrong>, perché dichiara un rapporto fra costi che riguarda i pazienti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">La responsabilità professionale non si trasferisce al software.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:20px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"108 elenco · riproducibilità\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"4cd55727\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Riproducibilità e versionamento<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Il preprocessing fa parte del modello.<\u002Fstrong> Imputazione, codifiche, standardizzazione e costruzione delle variabili derivate vanno versionate insieme ai pesi e applicate identiche in produzione.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>La calibrazione è un artefatto inseparabile.<\u002Fstrong> Va versionata con il modello su cui è stata stimata, e con l'indicazione della popolazione su cui è stata calcolata.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>I dati vanno versionati come il codice<\u002Fstrong>: definizione della coorte, criteri di inclusione, data di estrazione.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>I random seed non bastano.<\u002Fstrong> Versioni delle librerie, ordine delle operazioni e parallelismo possono cambiare il risultato.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:42px;font-weight:700;line-height:1.3;max-width:1520px\">Un modello clinico deve poter essere <strong>ricostruito<\u002Fstrong> a distanza di tempo, perché è la condizione perché il suo output possa essere giustificato.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
