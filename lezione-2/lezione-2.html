;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0\"><div style=\"font-size:24px;color:#4d5a78\">?<\u002Fdiv><div style=\"display:flex;align-items:center;width:120px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:22px 24px;width:420px\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:16px\">un record in produzione<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"display:flex;gap:6px\"><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><div style=\"width:32px;height:32px;border:2px solid #d4d7de;box-sizing:border-box\"><\u002Fdiv><div style=\"width:32px;height:32px;background:#2f6bff\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:24px;color:#4d5a78;margin-top:14px\">una colonna assente che in addestramento era quasi sempre presente<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:1620px;margin-top:22px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\"><strong>rifiutare la predizione<\u002Fstrong> e delegare a un operatore<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\"><strong>imputare<\u002Fstrong>, con le statistiche del training set<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">usare un <strong>modello addestrato sul sottoinsieme<\u002Fstrong> di colonne disponibili<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:26px;line-height:1.35\">gestione nativa del modello<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:12px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:30px;font-weight:700;line-height:1.3\">L'ultima opzione ha una criticità: il contributo associato all'assenza di una variabile è stimato <strong>sui casi in cui quella variabile mancava in addestramento<\u002Fstrong>: se sono pochissimi, il parametro è di fatto non addestrato.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"31 elenco · feature engineering\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"ee288f9e\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Feature engineering su dati di laboratorio<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Indicatori clinici noti in letteratura.<\u002Fstrong> Molti indici clinici consolidati sono ottenuti con formule sui valori misurati. Per individuarli è necessaria una ricerca in letteratura o il supporto di un esperto di dominio.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Differenze rispetto a un riferimento.<\u002Fstrong> Distanza dal limite superiore o inferiore dell'intervallo di normalità, in valore assoluto o in multipli dell'ampiezza.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Fasce di severità note.<\u002Fstrong> Hanno il vantaggio di rendere il modello più interpretabile per chi lo userà.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\"><strong>Aggregazioni.<\u002Fstrong> Numero di misure di laboratorio fuori range, numero di misure complessive.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Su dati clinici, a causa della loro scarsità, la conoscenza di dominio risulta particolarmente utile e spesso investire in questo aspetto garantisce un ritorno maggiore.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"32 range di riferimento\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"32b7d411\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 46px;max-width:1560px\">Range di riferimento<\u002Fh2>\n  <div style=\"display:flex;gap:60px;align-items:stretch\" data-enter=\"rise\">\n    <div style=\"flex:0 0 1030px;max-width:1030px\"><svg sc-camel-view-box=\"0 0 860 460\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><rect x=\"336\" y=\"40\" width=\"264\" height=\"320\" fill=\"#dfe9ff\"><\u002Frect><path d=\"M120 360 V 40 H 840\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M336 40 V 360 M600 40 V 360\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" stroke-dasharray=\"8 8\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M134 72 C 250 300, 330 330, 468 332 C 606 330, 700 262, 826 58\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"5\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"468\" y=\"28\" font-size=\"26\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">intervallo di riferimento<\u002Ftext><text x=\"126\" y=\"32\" font-size=\"26\" text-anchor=\"start\" fill=\"#4d5a78\">rischio<\u002Ftext><text x=\"228\" y=\"398\" font-size=\"28\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">sotto<\u002Ftext><text x=\"468\" y=\"398\" font-size=\"28\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">dentro<\u002Ftext><text x=\"716\" y=\"398\" font-size=\"28\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">sopra<\u002Ftext><text x=\"336\" y=\"432\" font-size=\"24\" text-anchor=\"middle\" fill=\"#4d5a78\">limite inf.<\u002Ftext><text x=\"600\" y=\"432\" font-size=\"24\" text-anchor=\"middle\" fill=\"#4d5a78\">limite sup.<\u002Ftext><text x=\"840\" y=\"456\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">valore misurato<\u002Ftext><\u002Fsvg><\u002Fdiv>\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:26px;justify-content:center\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il clinico legge il referto in tre categorie: <strong>sotto<\u002Fstrong>, <strong>dentro<\u002Fstrong>, <strong>sopra<\u002Fstrong> l'intervallo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il modello vede solo un numero su una scala continua: quell'intervallo non lo conosce.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">L'intervallo <strong>cambia con età e sesso<\u002Fstrong>: lo stesso valore non significa la stessa cosa in due pazienti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Passare al modello <strong>la posizione rispetto all'intervallo<\u002Fstrong>, e non solo il valore, gli dà l'informazione che il clinico usa.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n\n\n<section data-label=\"36 elenco · prevenzione leakage\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"6106072a\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Preprocessing e prevenzione del leakage<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:32px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Le statistiche si calcolano sul solo training set.<\u002Fstrong> Medie, deviazioni standard, valori di imputazione, quantili, codifiche delle categoriche.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>La selezione delle variabili sta dentro la cross-validation<\u002Fstrong>, non prima. Selezionare su tutto il dataset e poi validare produce una stima ottimistica.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Lo split rispetta la struttura dei dati.<\u002Fstrong> Se un paziente compare più volte, tutte le sue righe stanno dalla stessa parte. Se i dati vengono da centri diversi, lo split casuale non misura la generalizzazione che interessa.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Il preprocessing fa parte del modello<\u002Fstrong> e va versionato con i pesi. In produzione va applicato identico, nella stessa sequenza.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"37 divisoria · Passo 3\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"54294d44\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 3<\u002Fp>\n    <h2 style=\"margin:0;font-size:180px;font-weight:700;letter-spacing:-5px;line-height:1.05\">Dalla baseline ai modelli avanzati<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"38 codice · baseline logistica\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"beaca096\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Baseline: regressione logistica<\u002Fh2>\n  <p style=\"margin:0 0 30px;font-size:32px;line-height:1.35;max-width:1620px\">Il modello di riferimento storico per il rischio clinico. Un coefficiente per variabile, e il logit della probabilità come somma dei contributi.<\u002Fp>\n  <div style=\"background:#dfe9ff;padding:36px 46px;align-self:flex-start\" data-enter=\"rise\"><div style=\"font-size:52px;line-height:1.25;white-space:nowrap\">logit <em>p<\u002Fem>(<em>x<\u002Fem>) = β<span style=\"font-size:.8em;vertical-align:-.14em\">0<\u002Fspan> + β<span style=\"font-size:.8em;vertical-align:-.14em\">1<\u002Fspan><em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">1<\u002Fspan> + β<span style=\"font-size:.8em;vertical-align:-.14em\">2<\u002Fspan><em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">2<\u002Fspan> + … + β<span style=\"font-size:.8em;vertical-align:-.14em\">p<\u002Fspan><em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">p<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1540px;margin-top:34px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Ogni coefficiente ha un'interpretazione diretta: <strong>odds ratio<\u002Fstrong> per unità di variabile.<\u002Fp><\u002Fdiv>\n    \n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">È la forma di molti punteggi di rischio in uso clinico.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Il limite.<\u002Fstrong> Assume che l'effetto di ogni variabile sul logit sia lineare: sui valori di laboratorio il rischio sale a entrambe le code, e una retta non può rappresentarlo.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Rappresentando molti modelli&nbsp;<strong>realmente in uso<\u002Fstrong>, costituisce un ottimo punto di partenza. Il passo successivo abbandona la linearità e <strong>tiene l'additività<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n\n<section data-label=\"40 codice · GAM\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"9a8d27dc\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">GAM — Generalized Additive Models<\u002Fh2>\n  <p style=\"margin:0 0 30px;font-size:32px;line-height:1.35;max-width:1620px\">I <strong>GAM<\u002Fstrong> sostituiscono ogni coefficiente con una funzione stimata dai dati. La forma della dipendenza è appresa.<\u002Fp>\n  <div style=\"background:#dfe9ff;padding:36px 46px;align-self:flex-start\" data-enter=\"rise\"><div style=\"display:grid;grid-template-columns:auto auto;gap:22px 40px;align-items:baseline\"><div style=\"font-size:28px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78\">lineare<\u002Fdiv><div style=\"font-size:46px;line-height:1.25;white-space:nowrap\">logit <em>p<\u002Fem>(<em>x<\u002Fem>) = β<span style=\"font-size:.8em;vertical-align:-.14em\">0<\u002Fspan> + Σ<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> β<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> <em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan><\u002Fdiv><div style=\"font-size:28px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78\">GAM<\u002Fdiv><div style=\"font-size:46px;line-height:1.25;white-space:nowrap\">logit <em>p<\u002Fem>(<em>x<\u002Fem>) = β<span style=\"font-size:.8em;vertical-align:-.14em\">0<\u002Fspan> + Σ<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> <span style=\"color:#2f6bff;font-weight:700\"><em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>(<em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>)<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1540px;margin-top:34px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Ogni <span style=\"font-family: Consolas, Menlo, &quot;DejaVu Sans Mono&quot;, monospace; font-size: 0.9em;\">f_j<\u002Fspan> è una <strong>shape function<\u002Fstrong>: una relazione che si può valorizzare su ogni record.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Si perde la linearità, si conserva la <strong>somma<\u002Fstrong>: il contributo di ogni variabile resta separabile dagli altri.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">L'additività rendere il modello interpretabile.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"41 shape function\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"41a5c0de\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 34px;max-width:1560px\">Stima delle shape function<\u002Fh2>\n  <p style=\"margin:0 0 36px;font-size:36px;line-height:1.35;max-width:1620px\">Ogni curva viene <strong>stimata dai dati<\u002Fstrong>, una variabile alla volta.<\u002Fp>\n  <div style=\"display:flex;gap:56px;justify-content:flex-start\" data-enter=\"rise\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg sc-camel-view-box=\"0 0 260 150\" style=\"width:340px;height:196px;display:block\"><path d=\"M30 130 H250 M30 14 V130\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M38 118 C 90 112, 130 60, 244 34\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:30px;font-weight:700\"><em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">1<\u002Fspan><\u002Fdiv><div style=\"font-size:26px;color:#4d5a78\">età<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg sc-camel-view-box=\"0 0 260 150\" style=\"width:340px;height:196px;display:block\"><path d=\"M30 130 H250 M30 14 V130\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M38 30 C 100 128, 150 122, 244 96\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:30px;font-weight:700\"><em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">2<\u002Fspan><\u002Fdiv><div style=\"font-size:26px;color:#4d5a78\">primo analita<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\"><svg sc-camel-view-box=\"0 0 260 150\" style=\"width:340px;height:196px;display:block\"><path d=\"M30 130 H250 M30 14 V130\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M38 40 C 110 40, 150 118, 244 120\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:30px;font-weight:700\"><em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">3<\u002Fspan><\u002Fdiv><div style=\"font-size:26px;color:#4d5a78\">secondo analita<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1560px;margin-top:44px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">Non serve dire in anticipo dove sono le soglie: le trova la stima.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\">Il risultato è una curva per variabile, che si guarda e si discute con il clinico.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3\">È la stessa lettura del referto: rischio in funzione del valore, un grafico per esame.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"42 diagramma · GA2M\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:70px 110px 46px;box-sizing:border-box\" data-om-slide-id=\"42c9e0aa\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 20px;max-width:1560px\">Interazioni: modelli GA2M<\u002Fh2>\n  <div style=\"background:#dfe9ff;padding:24px 34px;align-self:flex-start\" data-enter=\"rise\"><div style=\"font-size:38px;line-height:1.25;white-space:nowrap\">logit <em>p<\u002Fem>(<em>x<\u002Fem>) = β<span style=\"font-size:.8em;vertical-align:-.14em\">0<\u002Fspan> + Σ<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> <em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>(<em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>) + Σ<sub style=\"font-size:.8em\">(j,k)<\u002Fsub> <span style=\"color:#2f6bff;font-weight:700\"><em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">jk<\u002Fspan>(<em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>, <em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">k<\u002Fspan>)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:56px;align-items:center;margin-top:6px\" data-enter=\"rise\"><div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-size:30px;font-weight:700\">↑ <em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">k<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px\"><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.71)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.78)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.58)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.27)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.14)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.11)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.45)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.52)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.32)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.17)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.25)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.22)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.20)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.27)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.15)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.28)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.36)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.33)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.13)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.10)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.19)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.32)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.40)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.37)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.23)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.30)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.13)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.26)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.34)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.31)\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.49)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.56)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(47,107,255,0.37)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.15)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.23)\"><\u002Fdiv><div style=\"width:32px;height:32px;background:rgba(20,33,61,0.20)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font-size:30px;font-weight:700;text-align:center\"><em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> →<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;font-size:30px;color:#4d5a78\"><div style=\"font-weight:700;color:#14213d\">il termine di coppia <em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">jk<\u002Fspan><\u002Fdiv><div><span style=\"display:inline-block;width:28px;height:28px;background:rgba(47,107,255,.85);vertical-align:-5px;margin-right:12px\"><\u002Fspan>alza il logit<\u002Fdiv><div><span style=\"display:inline-block;width:28px;height:28px;background:rgba(20,33,61,.35);vertical-align:-5px;margin-right:12px\"><\u002Fspan>abbassa il logit<\u002Fdiv><div>un riquadro = una coppia di bin<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1620px;margin-top:24px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il modello additivo puro non rappresenta le interazioni: l'effetto di una variabile non può dipendere dal valore di un'altra. Il <strong>GA2M<\u002Fstrong> aggiunge termini su coppie di variabili, selezionate automaticamente durante l'addestramento.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Ogni <em>f<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">jk<\u002Fspan> è una <strong>funzione di due variabili<\u002Fstrong>, R²→R, stimata a gradini su una griglia di bin: per questo si disegna come heatmap.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:24px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:22px 30px\"><p style=\"margin:0;font-size:32px;font-weight:700;line-height:1.3\">Il numero di coppie ammesse è un iperparametro, e i valori predefiniti sono <strong>generosi<\u002Fstrong>: la leggibilità è reale sulle curve singole, sulle coppie è nominale.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"43 diagramma · EBM\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"a1868d76\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 26px;max-width:1560px\">Explainable Boosting Machine<\u002Fh2>\n  <div style=\"flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0;overflow:hidden\" data-enter=\"rise\"><div style=\"display:flex;align-items:center;gap:56px\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px\"><div style=\"display:flex;align-items:center;gap:0px\"><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:14px 20px;font-size:30px;font-weight:700;text-align:center;min-width:110px\">x_1<\u002Fdiv><div style=\"display:flex;align-items:center;width:44px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:14px 20px;font-size:30px;font-weight:700;text-align:center;min-width:110px\">x_2<\u002Fdiv><div style=\"display:flex;align-items:center;width:44px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:30px;color:#4d5a78;padding:0 10px\">…<\u002Fdiv><div style=\"display:flex;align-items:center;width:44px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:12px;padding:14px 20px;font-size:30px;font-weight:700;text-align:center;min-width:110px\">x_p<\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 620 70\" style=\"width:620px;height:70px;display:block\"><path d=\"M600 0 V50 H30 V14\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M30 0 l-9 18 h18 z\" fill=\"#14213d\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"border:2px solid #d4d7de;border-radius:16px;padding:22px 24px;width:260px\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:16px\">giri<\u002Fdiv><div style=\"font-size:30px;line-height:1.3\">passo piccolo,<br>molti giri<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1620px;margin-top:30px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">È un <strong>GA2M addestrato con boosting ciclico<\u002Fstrong>: prima i termini univariati, poi le coppie selezionate.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il passo è deliberatamente piccolo e i giri sono molti, così che l'ordine delle variabili non conti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Ogni variabile riceve una <strong>categoria dedicata per i valori assenti<\u002Fstrong>, con un contributo proprio, stimata come gli altri.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il costo di addestramento è di uno o due ordini di grandezza superiore a quello di un gradient boosting non vincolato sullo stesso dato.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:46px;font-weight:700;line-height:1.3;max-width:1520px\">Implementato nella libreria <span style=\"font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:.9em\">interpret<\u002Fspan>, con licenza MIT.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"45 diagramma · non identificabilità\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:80px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"4cd28e44\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 26px;max-width:1560px\">Non identificabilità dei modelli additivi<\u002Fh2>\n  <div style=\"flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 0\" data-enter=\"rise\"><div style=\"display:flex;align-items:center;gap:14px\"><div style=\"display:flex;flex-direction:column;align-items:stretch;gap:16px\"><div style=\"display:flex;align-items:center;gap:16px\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><svg sc-camel-view-box=\"0 0 150 72\" style=\"width:150px;height:72px;display:block;\"><path d=\"M18 56 H 142 M18 8 V 56\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M18 60 C 50 16, 80 76, 182 26\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:28px;color:#4d5a78;text-align:center\">f_1<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><svg sc-camel-view-box=\"0 0 150 72\" style=\"width:150px;height:72px;display:block;\"><path d=\"M18 56 H 142 M18 8 V 56\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M18 26 C 60 74, 110 20, 182 62\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:28px;color:#4d5a78;text-align:center\">f_2<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:16px\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><svg sc-camel-view-box=\"0 0 150 72\" style=\"width:150px;height:72px;display:block;\"><path d=\"M18 56 H 142 M18 8 V 56\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M18 50 C 50 6, 80 66, 182 16\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:28px;color:#4d5a78;text-align:center\">f_1' = f_1 + c<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><svg sc-camel-view-box=\"0 0 150 72\" style=\"width:150px;height:72px;display:block;\"><path d=\"M18 56 H 142 M18 8 V 56\" fill=\"none\" stroke=\"#8b96ad\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M18 36 C 60 84, 110 30, 182 72\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"font-size:28px;color:#4d5a78;text-align:center\">f_2' = f_2 − c<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 90 400\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:90px;height:190px;display:block\"><path d=\"M0 100 H45 V200 M0 300 H45 V200 M45 200 H90\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><\u002Fsvg><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:20px 22px;text-align:center;box-sizing:border-box;width:300px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">stessa somma<\u002Fdiv><div style=\"font-size:24px;line-height:1.25;margin-top:8px;color:#3a4a70\">stessa predizione<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display: flex; gap: 14px; max-width: 1620px; margin-top: 22px; flex-shrink: 0; flex-direction: column; align-items: stretch; justify-content: flex-start\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Una costante spostata da una componente all'altra <strong>non cambia la predizione<\u002Fstrong>. Serve un vincolo aggiuntivo per rendere la scomposizione unica.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Con <strong>variabili correlate<\u002Fstrong> il problema si amplifica.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Se si cerca di interpretare le shape function, due modelli equivalenti in predizione possono suggerire letture cliniche diverse.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:20px;flex-shrink:0\" data-enter=\"rise\"><\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section data-label=\"47 elenco · alberi e random forest\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"0aaafc02\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 48px;max-width:1560px\">Decision tree e random forest<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:24px;max-width:1400px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>L'albero singolo<\u002Fstrong> partiziona lo spazio con soglie su singole variabili. È leggibile finché resta poco profondo, e instabile: piccole variazioni nei dati cambiano la struttura.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Il random forest<\u002Fstrong> media molti alberi addestrati su resampling e sottoinsiemi di variabili. Riduce la varianza, perde l'interpretabilità.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>Pregi pratici<\u002Fstrong>: pochi iperparametri, addestramento rapido, gestione implicita dei valori assenti, e nessuna necessità di standardizzare.<\u002Fp><\u002Fdiv>\n    \n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:46px;font-weight:700;line-height:1.3;max-width:1520px\"><\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"48 diagramma · gradient boosting\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"cae5fd42\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 26px;max-width:1560px\">Gradient boosting<\u002Fh2>\n  <div style=\"flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0;overflow:hidden\" data-enter=\"rise\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><div style=\"display:flex;align-items:center;gap:0px\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:230px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">modello_0<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:190px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">residui<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:210px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">albero_1<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:190px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">residui<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;width:46px;flex-shrink:0\"><div style=\"height:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:16px solid #14213d\"><\u002Fdiv><\u002Fdiv><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:210px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">albero_2<\u002Fdiv><\u002Fdiv><div style=\"font-size:30px;color:#4d5a78;padding-left:22px\">…<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;height:44px\"><div style=\"width:4px;flex:1;background:#14213d\"><\u002Fdiv><div style=\"width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #14213d\"><\u002Fdiv><div style=\"font-size:24px;color:#4d5a78\">somma pesata<\u002Fdiv><\u002Fdiv><div style=\"background:#2f6bff;color:#ffffff;border-radius:16px;padding:24px 24px;text-align:center;box-sizing:border-box;width:380px\"><div style=\"font-size:34px;font-weight:700;line-height:1.15\">modello finale<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1620px;margin-top:30px;flex-shrink:0\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Ogni albero è addestrato a correggere l'errore dei precedenti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Gli alberi sono <strong>deliberatamente poco profondi<\u002Fstrong>&nbsp;e il learning rate è piccolo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Gli iperparametri principali sono tre: numero di alberi, profondità, learning rate. Si influenzano a vicenda.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">La regolarizzazione avviene per subsampling di righe e colonne, e per penalizzazione sulla dimensione degli alberi.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">Baseline di riferimento su dati tabellari.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"49 colonne · tre librerie\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:78px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"49d3b7c1\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 30px;max-width:1560px\">XGBoost, LightGBM, CatBoost<\u002Fh2>\n  <div style=\"display:flex;gap:44px;align-items:stretch;margin-top:4px\" data-enter=\"rise\"><div style=\"width:520px;box-sizing:border-box\"><div style=\"font-size:38px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:22px\">XGBoost<\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">principio<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Crescita <strong>per livello<\u002Fstrong>: l'albero si espande un piano alla volta.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">pro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Comportamento prevedibile, la più collaudata, ottimo supporto ai vincoli di monotonicità.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">contro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Le variabili categoriche vanno codificate a mano.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:520px;box-sizing:border-box\"><div style=\"font-size:38px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:22px\">LightGBM<\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">principio<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Crescita <strong>per foglia<\u002Fstrong>: espande la foglia che promette il guadagno maggiore.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">pro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">La più rapida sui dataset grandi; gestisce le categoriche nativamente.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">contro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Su pochi dati va più facilmente in overfitting.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"width:520px;box-sizing:border-box\"><div style=\"font-size:38px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:14px;margin-bottom:22px\">CatBoost<\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">principio<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Alberi <strong>simmetrici<\u002Fstrong> e <strong>target encoding ordinato<\u002Fstrong> per le categoriche.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">pro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Robusto sui dataset piccoli, spesso il meglio calibrato.<\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:20px\"><div style=\"font-size:24px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:6px\">contro<\u002Fdiv><div style=\"font-size:28px;line-height:1.3\">Più lento; i valori assenti finiscono sempre allo stesso estremo.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:34px;font-weight:700;line-height:1.3\">Le differenze di accuratezza fra i tre sono tipicamente <strong>entro l'incertezza della misura<\u002Fstrong>. Si scelgono per come trattano categoriche, valori assenti e campioni piccoli.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"50 grafico · monotonicità\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:86px 110px 70px;box-sizing:border-box\" data-om-slide-id=\"50e1a992\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 28px;max-width:1560px\">Vincoli di monotonicità<\u002Fh2>\n  <div style=\"display:flex;gap:56px;align-items:center\" data-enter=\"rise\">\n    <div style=\"flex:0 0 900px;max-width:900px\"><div style=\"display:flex;flex-direction:column;gap:14px;width:100%\"><svg sc-camel-view-box=\"0 0 860 440\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;height:auto;display:block;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif\"><rect x=\"470\" y=\"40\" width=\"120\" height=\"320\" fill=\"#dfe9ff\"><\u002Frect><path d=\"M120 360 V 40 H 840\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M132 330 C 260 280, 340 200, 430 188 C 480 182, 505 238, 560 232 C 660 220, 730 126, 828 84\" fill=\"none\" stroke=\"#14213d\" stroke-width=\"4\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><path d=\"M132 330 C 300 278, 420 204, 560 168 C 700 132, 780 100, 828 84\" fill=\"none\" stroke=\"#2f6bff\" stroke-width=\"5\" stroke-dasharray=\"14 10\" vector-effect=\"non-scaling-stroke\"><\u002Fpath><text x=\"530\" y=\"28\" font-size=\"26\" text-anchor=\"middle\" fill=\"#14213d\" font-weight=\"700\">pochi dati qui<\u002Ftext><text x=\"126\" y=\"32\" font-size=\"26\" text-anchor=\"start\" fill=\"#4d5a78\">contributo<\u002Ftext><text x=\"840\" y=\"398\" font-size=\"24\" text-anchor=\"end\" fill=\"#4d5a78\">valore della variabile<\u002Ftext><\u002Fsvg><div style=\"display:flex;gap:34px;flex-wrap:wrap;font-size:26px;color:#4d5a78\"><span style=\"display:inline-flex;align-items:center;gap:10px\"><span style=\"width:38px;height:4px;background:#14213d\"><\u002Fspan>senza vincolo<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:10px\"><span style=\"width:38px;height:4px;background:repeating-linear-gradient(90deg,#2f6bff 0 10px,transparent 10px 18px)\"><\u002Fspan>con vincolo<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Quando.<\u002Fstrong> Quando si sa già che l'effetto va in una sola direzione: più alto il valore, più alto il rischio.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Perché.<\u002Fstrong> Dove i dati sono pochi il modello disegna avvallamenti che non esistono. Una curva che scende dove non dovrebbe è un errore evidente per chi conosce il dominio, e fa perdere fiducia in tutto il modello.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Come.<\u002Fstrong> Si dichiara il vincolo prima dell'addestramento: durante la costruzione degli alberi vengono scartati gli split che lo violerebbero.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Quanto costa.<\u002Fstrong> Quasi niente in accuratezza: si sta aggiungendo un'informazione vera, non limitando il modello.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"51 modelli bayesiani\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:78px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"51ab77d0\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 26px;max-width:1560px\">Modelli bayesiani<\u002Fh2>\n  <p style=\"margin:0 0 26px;font-size:34px;line-height:1.35;max-width:1620px\">Invece di un solo valore per ogni parametro, si stima una <strong>distribuzione<\u002Fstrong> di valori possibili.<\u002Fp>\n  <div style=\"background:#dfe9ff;padding:28px 38px;align-self:flex-start\" data-enter=\"rise\"><div style=\"font-size:44px;line-height:1.25;white-space:nowrap\"><span style=\"color:#2f6bff;font-weight:700\">p(θ | dati)<\u002Fspan> ∝ p(dati | θ) · p(θ)<\u002Fdiv><\u002Fdiv>\n  <p style=\"margin:16px 0 0;font-size:28px;line-height:1.35;color:#4d5a78;max-width:1620px\">a sinistra ciò che si conclude sui parametri, poi quanto i dati sono compatibili con essi, poi ciò che si assumeva prima di vederli.<\u002Fp>\n  <div style=\"display:flex;gap:60px;align-items:stretch;margin-top:22px\" data-enter=\"rise\"><div style=\"flex:1 1 0;min-width:0\"><div style=\"font-size:32px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:12px;margin-bottom:20px\">vantaggi<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Dà un'incertezza <strong>sul modello<\u002Fstrong>, non solo sulla singola predizione.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Permette di inserire conoscenza di dominio come distribuzione a priori.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Regge meglio quando i dati sono pochi.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:1 1 0;min-width:0\"><div style=\"font-size:32px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:12px;margin-bottom:20px\">svantaggi<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Il costo di calcolo cresce rapidamente con il numero di osservazioni.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Su dati tabellari <strong>non è competitivo<\u002Fstrong> con il gradient boosting.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Le distribuzioni a priori sono una scelta in più da giustificare.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:22px;flex-shrink:0\" data-enter=\"rise\"><div style=\"border:2px solid #8b96ad;border-radius:16px;padding:22px 28px\"><div style=\"font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;margin-bottom:12px\">un esempio<\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\"><strong>Regressione logistica bayesiana.<\u002Fstrong> Stessa forma della baseline, ma ogni coefficiente β<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> è una distribuzione invece di un numero. Il risultato non è «l'effetto dell'analita A è +0,4», è «è +0,4, plausibilmente fra +0,1 e +0,7». Su un paziente si ottiene così <strong>un intervallo sulla probabilità predetta<\u002Fstrong>, non un solo valore.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"52 additivi neurali\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:78px 110px 54px;box-sizing:border-box\" data-om-slide-id=\"52c4e118\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:36px 0 26px;max-width:1560px\">Modelli additivi neurali<\u002Fh2>\n  <p style=\"margin:0 0 26px;font-size:34px;line-height:1.35;max-width:1620px\">Stessa struttura additiva dei GAM, ma ogni shape function è una <strong>piccola rete neurale<\u002Fstrong>.<\u002Fp>\n  <div style=\"background:#dfe9ff;padding:28px 38px;align-self:flex-start\" data-enter=\"rise\"><div style=\"font-size:44px;line-height:1.25;white-space:nowrap\">logit <em>p<\u002Fem>(<em>x<\u002Fem>) = β<span style=\"font-size:.8em;vertical-align:-.14em\">0<\u002Fspan> + Σ<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan> <span style=\"color:#2f6bff;font-weight:700\">rete<span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>(<em>x<\u002Fem><span style=\"font-size:.8em;vertical-align:-.14em\">j<\u002Fspan>)<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <p style=\"margin:22px 0 0;font-size:28px;line-height:1.35;color:#4d5a78;max-width:1620px\">una rete per variabile, addestrate insieme · varianti principali: NAM, NODE-GAM, GAMI-Net<\u002Fp>\n  <div style=\"display:flex;gap:60px;align-items:stretch;margin-top:30px\" data-enter=\"rise\"><div style=\"flex:1 1 0;min-width:0\"><div style=\"font-size:32px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:12px;margin-bottom:20px\">vantaggi<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Sono differenziabili, quindi si addestrano insieme al resto di una pipeline.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Alcune varianti danno un'incertezza sulle singole curve.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Su dataset grandi e con molte interazioni vanno meglio degli additivi ad albero.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"flex:1 1 0;min-width:0\"><div style=\"font-size:32px;font-weight:700;border-bottom:3px solid #14213d;padding-bottom:12px;margin-bottom:20px\">svantaggi<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Servono molti dati: su tabellari piccoli non battono gli alberi.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Addestramento più lento e più iperparametri da scegliere.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:auto;padding-top:26px;flex-shrink:0\" data-enter=\"rise\"><div style=\"background:#dfe9ff;padding:24px 30px\"><p style=\"margin:0;font-size:32px;font-weight:700;line-height:1.3\">Utili quando la tabella va addestrata <strong>insieme<\u002Fstrong> a un'altra modalità, o quando serve un modello differenziabile end-to-end. Ma richiede molti dati.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n\n\n<section data-label=\"56 tabella · modelli ibridi\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"86174e4a\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Modelli ibridi<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">forma<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">MECCANISMO<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">VANTAGGIO<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">interpretabile con delega<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">il modello leggibile decide dove è competente, il resto va a un modello non vincolato<\u002Fsc-raw-td><sc-raw-td style=\"font-size:26px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">è noto&nbsp;<strong>quali<\u002Fstrong> casi hanno ricevuto una decisione spiegabile<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">additivo con correzione residua<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">un modello additivo cattura la parte principale, un boosting impara il residuo<\u002Fsc-raw-td><sc-raw-td style=\"font-size:26px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">completamente spiegabile, se si accettano i due layer di interpretabilità<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">forma additiva estratta<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">si addestra un boosting con vincoli di interazione e lo si scompone in componenti leggibili<\u002Fsc-raw-td><sc-raw-td style=\"font-size:26px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">leggibilità a posteriori senza rinunciare all'addestramento non vincolato<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px 16px 0;border-bottom:2px solid #d4d7de\">distillazione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.32;color:inherit;padding:16px 22px;border-bottom:2px solid #d4d7de\">un modello complesso genera le etichette con cui si addestra un modello semplice<\u002Fsc-raw-td><sc-raw-td style=\"font-size:26px;line-height:1.32;color:#4d5a78;padding:16px 0 16px 22px;border-bottom:2px solid #d4d7de\">modello distillato leggibile e leggero<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"margin-top:auto;padding-top:34px;flex-shrink:0\" data-enter=\"rise\"><p style=\"margin:0;font-size:38px;font-weight:700;line-height:1.3;max-width:1520px\">La prima forma è la più adatta a un contesto clinico, perché rende esplicito il sottoinsieme di pazienti su cui il sistema è in grado di motivare la propria uscita.<\u002Fp><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"57 tabella · metodi non trattati\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\" data-om-slide-id=\"1999d630\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:44px 0 30px;max-width:1560px\">Metodi non trattati (review, primo passo)<\u002Fh2>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;table-layout:auto\" data-enter=\"rise\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px 0;border-bottom:4px solid #14213d;font-weight:700\">metodo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">ambito<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 22px 22px;border-bottom:4px solid #14213d;font-weight:700\">riferimento<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">NeuMiss<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">architettura per il predittore ottimo con valori assenti<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">Le Morvan et al., NeurIPS 2020<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">pattern submodels<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">un modello per ciascun pattern di missingness<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:#4d5a78;padding:12px 0 12px 22px;border-bottom:2px solid #d4d7de\">letteratura statistica su dati incompleti<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px 12px 0;border-bottom:2px solid #d4d7de\">MICE, regole di Rubin<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-height:1.32;color:inherit;padding:12px 22px;border-bottom:2px solid #d4d7de\">imputazione multipla con inferenza corretta<\u002Fsc-raw-td><sc-raw-td style=\"font-size:24px;line-
