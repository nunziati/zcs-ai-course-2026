" x=\"950\" y=\"156\" text-anchor=\"middle\">+ rumore<\u002Ftext>\n  <g opacity=\"1.0\"><path class=\"labbra\" d=\"M 1016 114 C 1026 100 1040 96 1050 105 C 1060 96 1074 100 1084 114 C 1067 117 1033 117 1016 114 Z\"><\u002Fpath><path class=\"labbra\" d=\"M 1016 114 C 1033 117 1067 117 1084 114 C 1072 134 1028 134 1016 114 Z\"><\u002Fpath><path class=\"rima\" d=\"M 1016 114 C 1033 117 1067 117 1084 114\"><\u002Fpath><\u002Fg>\n  <rect class=\"box\" x=\"1000\" y=\"64\" width=\"100\" height=\"100\"><\u002Frect>\n  <text class=\"muted cap\" x=\"250\" y=\"188\" text-anchor=\"middle\">solo rumore<\u002Ftext>\n  <text class=\"muted cap\" x=\"1050\" y=\"188\" text-anchor=\"middle\">immagine<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:32px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">L'addestramento aggiunge <strong>rumore<\u002Fstrong> alle immagini vere, a livelli diversi, e la rete impara a stimare il rumore aggiunto.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">A ogni passo la rete riceve anche il <strong>condizionamento<\u002Fstrong>: per un'immagine un testo, nel lip sync l'audio e la regione della bocca da riscrivere.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">In generazione la stessa rete stima il rumore presente e ne toglie una parte a ogni passo.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">L'addestramento è <strong>stabile<\u002Fstrong>, a differenza di quello di una GAN; il prezzo è il <strong>numero di passi<\u002Fstrong>.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:26px;border-top:2px solid #d4d7de;padding-top:18px;font-size:27px;color:#3f4a63;line-height:1.4\">Diffusione, Ho, Jain e Abbeel, arXiv:2006.11239.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"31 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 68px;max-width:1560px\">Generazione dell'intero volto parlante<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:52px;max-width:1500px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:17px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:42px;line-height:1.35\">L'ingresso è <strong>una sola immagine<\u002Fstrong> e una traccia audio; l'uscita è un video di quella persona che parla, con pose della testa, battiti di ciglia ed espressioni.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:17px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:42px;line-height:1.35\">Il lip sync modifica una ripresa esistente, mentre qui <strong>la ripresa non esiste<\u002Fstrong>: pose ed espressioni sono generate e non corrispondono a niente che la persona abbia fatto.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"32 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 26px;max-width:1560px\">La pipeline di doppiaggio<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 310\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"La pipeline di doppiaggio: l'audio del video originale passa per il riconoscimento vocale, la traduzione e la sintesi con la voce clonata da un campione del video originale; il lip sync riceve l'audio sintetizzato e i frame originali; i primi due stadi producono il testo intermedio\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"40\" y=\"34\" width=\"220\" height=\"46\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"150\" y=\"63\" text-anchor=\"middle\">video originale<\u002Ftext>\n  <path class=\"arr\" d=\"M 150 80 V 118\"><\u002Fpath>\n  <path class=\"head\" d=\"M 150 130 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"162\" y=\"111\">audio<\u002Ftext>\n  <rect class=\"box\" x=\"40\" y=\"130\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"150\" y=\"166\" text-anchor=\"middle\">riconoscimento vocale<\u002Ftext>\n  <text class=\"muted cap\" x=\"150\" y=\"216\" text-anchor=\"middle\">testo nella lingua<\u002Ftext>\n  <text class=\"muted cap\" x=\"150\" y=\"236\" text-anchor=\"middle\">di partenza<\u002Ftext>\n  <rect class=\"box\" x=\"300\" y=\"130\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"410\" y=\"166\" text-anchor=\"middle\">traduzione<\u002Ftext>\n  <text class=\"muted cap\" x=\"410\" y=\"216\" text-anchor=\"middle\">testo nella lingua<\u002Ftext>\n  <text class=\"muted cap\" x=\"410\" y=\"236\" text-anchor=\"middle\">di arrivo<\u002Ftext>\n  <rect class=\"box\" x=\"560\" y=\"130\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"670\" y=\"166\" text-anchor=\"middle\">sintesi con voce clonata<\u002Ftext>\n  <text class=\"muted cap\" x=\"670\" y=\"216\" text-anchor=\"middle\">audio nella lingua di arrivo,<\u002Ftext>\n  <text class=\"muted cap\" x=\"670\" y=\"236\" text-anchor=\"middle\">voce originale<\u002Ftext>\n  <rect class=\"box\" x=\"820\" y=\"130\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"930\" y=\"166\" text-anchor=\"middle\">lip sync<\u002Ftext>\n  <text class=\"muted cap\" x=\"930\" y=\"216\" text-anchor=\"middle\">video con la bocca<\u002Ftext>\n  <text class=\"muted cap\" x=\"930\" y=\"236\" text-anchor=\"middle\">risincronizzata<\u002Ftext>\n  <path class=\"arr\" d=\"M 260 160 H 288\"><\u002Fpath>\n  <path class=\"head\" d=\"M 300 160 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 520 160 H 548\"><\u002Fpath>\n  <path class=\"head\" d=\"M 560 160 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 780 160 H 808\"><\u002Fpath>\n  <path class=\"head\" d=\"M 820 160 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 260 46 H 930 V 118\"><\u002Fpath>\n  <path class=\"head\" d=\"M 930 130 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"800\" y=\"36\" text-anchor=\"middle\">frame originali<\u002Ftext>\n  <path class=\"tratt\" d=\"M 260 68 H 670 V 118\"><\u002Fpath>\n  <path class=\"headm\" d=\"M 670 130 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"465\" y=\"96\" text-anchor=\"middle\">campione della voce<\u002Ftext>\n  <path class=\"tratt\" d=\"M 40 268 H 520 M 40 268 V 252 M 520 268 V 252\"><\u002Fpath>\n  <text class=\"acc cap\" x=\"280\" y=\"292\" text-anchor=\"middle\">testo intermedio: ispezionabile e correggibile<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px;margin-top:34px;max-width:1600px\">\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Gli stadi sono modelli distinti, addestrati separatamente e su materiale diverso.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">Il testo intermedio permette di sostituire un modello per volta.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"33 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Allucinazioni del riconoscimento vocale<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:44px;max-width:1520px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\">Sui segmenti <strong>senza parlato<\u002Fstrong>, come le pause fra una frase e l'altra, un modello autoregressivo, come Whisper, può produrre frasi plausibili che nessuno ha pronunciato: ringraziamenti per la visione, inviti a visitare un sito.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\">Dal solo testo è impossibile capire se il testo generato corrisponde a parole effettivamente pronunciate.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\">Le contromisure <strong>devono essere applicate prima della trascrizione<\u002Fstrong>, e consistono nel togliere i segmenti senza parlato, individuati per esempio con una soglia sull'energia del segnale.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;border-top:2px solid #d4d7de;padding-top:22px;font-size:27px;color:#3f4a63;line-height:1.4\">Allucinazioni di Whisper, Koenecke et al., ACM FAccT 2024, arXiv:2402.08021.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"34 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 26px;max-width:1560px\">Propagazione dell'errore lungo la pipeline<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 225\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Propagazione dell'errore lungo la pipeline di doppiaggio: la stessa parola sbagliata diventa una frase sbagliata, poi una frase detta con la voce originale, poi labbra che la pronunciano, con credibilità crescente\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"40\" y=\"40\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"150\" y=\"76\" text-anchor=\"middle\">riconoscimento vocale<\u002Ftext>\n  <text class=\"muted cap\" x=\"150\" y=\"126\" text-anchor=\"middle\">una parola sbagliata<\u002Ftext>\n  <text class=\"muted cap\" x=\"150\" y=\"146\" text-anchor=\"middle\">nella trascrizione<\u002Ftext>\n  <rect class=\"box\" x=\"300\" y=\"40\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"410\" y=\"76\" text-anchor=\"middle\">traduzione<\u002Ftext>\n  <text class=\"muted cap\" x=\"410\" y=\"126\" text-anchor=\"middle\">una frase sbagliata,<\u002Ftext>\n  <text class=\"muted cap\" x=\"410\" y=\"146\" text-anchor=\"middle\">grammaticalmente corretta<\u002Ftext>\n  <rect class=\"box\" x=\"560\" y=\"40\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"670\" y=\"76\" text-anchor=\"middle\">sintesi con voce clonata<\u002Ftext>\n  <text class=\"muted cap\" x=\"670\" y=\"126\" text-anchor=\"middle\">la frase sbagliata detta<\u002Ftext>\n  <text class=\"muted cap\" x=\"670\" y=\"146\" text-anchor=\"middle\">con la voce originale<\u002Ftext>\n  <rect class=\"box\" x=\"820\" y=\"40\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"930\" y=\"76\" text-anchor=\"middle\">lip sync<\u002Ftext>\n  <text class=\"muted cap\" x=\"930\" y=\"126\" text-anchor=\"middle\">le labbra che<\u002Ftext>\n  <text class=\"muted cap\" x=\"930\" y=\"146\" text-anchor=\"middle\">la pronunciano<\u002Ftext>\n  <path class=\"arr\" d=\"M 260 70 H 288\"><\u002Fpath>\n  <path class=\"head\" d=\"M 300 70 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 520 70 H 548\"><\u002Fpath>\n  <path class=\"head\" d=\"M 560 70 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 780 70 H 808\"><\u002Fpath>\n  <path class=\"head\" d=\"M 820 70 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path d=\"M 40 200 H 1006\" style=\"fill: none; stroke: var(--accent, #2f6bff); stroke-width: 2.4\"><\u002Fpath>\n  <path d=\"M 1020 200 l -16 -8 v 16 Z\" style=\"fill: var(--accent, #2f6bff); stroke: none\"><\u002Fpath>\n  <text class=\"acc cap\" x=\"440\" y=\"188\">credibilità crescente<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px;margin-top:32px;max-width:1600px\">\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Vista l'indipendenza degli stadi della pipeline, nessun blocco è in grado, in principio, di rilevare errori avvenuti in blocchi precedenti.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Ogni stadio aggiunge errori propri, perché riceve un ingresso diverso da quello su cui è stato addestrato.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:34px 0 0;font-size:40px;font-weight:700;line-height:1.3;max-width:1620px\">L'errore è più semplice da riconoscere quando l'informazione è <span style=\"color:#2f6bff\">simbolica<\u002Fspan> (ovvero, normalmente, finché è testuale).<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"35 Divisoria\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 4<\u002Fp>\n    <h2 style=\"margin:0;font-size:116px;font-weight:700;letter-spacing:-3px;line-height:1.06;max-width:1560px\">Valutazione: metriche automatiche e giudizio umano<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"36 Colonne\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 48px;max-width:1560px\">Giudizio umano: MOS e confronto appaiato<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px\" data-enter=\"rise\">\n    <div>\n      <p style=\"margin:0 0 16px;font-size:38px;font-weight:700;line-height:1.15\">Mean Opinion Score (MOS)<\u002Fp>\n      <div style=\"height:4px;background:#14213d;margin-bottom:30px\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">più ascoltatori valutano ogni campione su una scala da uno a cinque, e i voti sono mediati: è lo standard de facto della letteratura<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">poco sensibile: differenze reali fra sistemi vicini non emergono dai voti<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">servono decine di ascoltatori per ottenere un intervallo di confidenza utile<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <p style=\"margin:0 0 16px;font-size:38px;font-weight:700;line-height:1.15\">Confronto appaiato<\u002Fp>\n      <div style=\"height:4px;background:#14213d;margin-bottom:30px\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">all'ascoltatore vengono presentati due campioni ed egli deve indicare il suo preferito<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">più stabile, perché non richiede di ricordare una scala<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">bastano molti meno ascoltatori per distinguere due sistemi vicini<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">il risultato è una preferenza fra due sistemi, e per confrontarne di più occorre una serie di confronti<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:34px;line-height:1.35;max-width:1620px\">Il MOS dipende dal gruppo di ascoltatori e dall'ordine di presentazione, quindi un MOS pubblicato e uno misurato in casa non sono confrontabili.<\u002Fp>\n  <div style=\"margin-top:30px;border-top:2px solid #d4d7de;padding-top:20px;font-size:27px;color:#3f4a63;line-height:1.4\"><em>Towards Responsible Evaluation for TTS<\u002Fem>, arXiv:2510.06927.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"37 Tabella\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 46px;max-width:1560px\">Famiglie di metriche automatiche per la voce<\u002Fh2>\n  <div data-enter=\"rise\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 16px 0;border-bottom:4px solid #14213d;font-weight:700;width:24%\">Proprietà<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 16px;border-bottom:4px solid #14213d;font-weight:700\">Metodo<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 16px 24px;border-bottom:4px solid #14213d;font-weight:700;width:26%\">Difetto<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:32px;font-weight:700;padding:24px 24px 24px 0;border-bottom:2px solid #d4d7de;vertical-align:top\">intelligibilità<\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;padding:24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">un riconoscitore vocale trascrive l'audio sintetico, e la misura è il tasso di errore di parola rispetto al testo da leggere<\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;color:#4d5a78;padding:24px 0 24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">il valore dipende dal riconoscitore usato<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:32px;font-weight:700;padding:24px 24px 24px 0;border-bottom:2px solid #d4d7de;vertical-align:top\">somiglianza al parlante<\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;padding:24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">un modello di verifica del parlante rappresenta l'audio sintetico e il campione di riferimento, e la misura è il coseno fra le due rappresentazioni<\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;color:#4d5a78;padding:24px 0 24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">confronta soprattutto il timbro, e poco il ritmo e l'intonazione<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#dfe9ff\"><sc-raw-td style=\"font-size:32px;font-weight:700;padding:24px 24px 24px 0;border-bottom:2px solid #d4d7de;vertical-align:top\"><span style=\"padding-left:24px\">naturalezza<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;padding:24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">un predittore neurale addestrato a riprodurre il MOS dato dagli ascoltatori<\u002Fsc-raw-td><sc-raw-td style=\"font-size:27px;line-height:1.35;color:#3a4a70;padding:24px 0 24px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">è affidabile solo su audio simile a quello su cui è stato addestrato<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:32px;line-height:1.35;max-width:1620px\">La metrica da usare discende dalla proprietà che l'applicazione richiede: un annuncio automatico in stazione chiede intelligibilità, un doppiaggio con la voce originale chiede naturalezza e somiglianza.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"38 Tabella\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Metriche per il lip sync<\u002Fh2>\n  <div data-enter=\"rise\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px 0;border-bottom:4px solid #14213d;font-weight:700;width:14%\">Metrica<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700;width:24%\">Direzione<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700\">Che cosa misura<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 18px 24px;border-bottom:4px solid #14213d;font-weight:700;width:26%\">Difetto<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:36px;font-weight:700;padding:30px 24px 30px 0;border-bottom:2px solid #d4d7de;vertical-align:top\">PSNR<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;padding:30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">più alta è meglio<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;padding:30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">fedeltà del frame rispetto all'originale<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;color:#4d5a78;padding:30px 0 30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">premia l'immobilità della bocca<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:36px;font-weight:700;padding:30px 24px 30px 0;border-bottom:2px solid #d4d7de;vertical-align:top\">FID<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;padding:30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">più bassa è meglio<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;padding:30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">verosimiglianza della distribuzione delle immagini<\u002Fsc-raw-td><sc-raw-td style=\"font-size:30px;line-height:1.35;color:#4d5a78;padding:30px 0 30px 24px;border-bottom:2px solid #d4d7de;vertical-align:top\">indifferente alla sincronia<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"margin:34px 0 0;font-size:30px;color:#3f4a63;line-height:1.4;max-width:1620px\">Il FID è una metrica generica per la generazione di immagini, non specifica per il lip sync.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"39 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Metriche per la traduzione<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:44px;max-width:1520px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>BLEU<\u002Fstrong> conta la sovrapposizione di sequenze di parole con una traduzione di riferimento, e correla male con il giudizio umano.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>COMET<\u002Fstrong> usa un encoder multilingue che proietta il testo in qualsiasi lingua che supporta in uno stesso spazio latente. Correla molto meglio con il giudizio umano, al prezzo di essere a sua volta un modello addestrato.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>COMET-KIWI<\u002Fstrong> produce una stima <strong>senza traduzione di riferimento<\u002Fstrong>, ed è la variante che serve nel doppiaggio, dove un riferimento non esiste quasi mai.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;border-top:2px solid #d4d7de;padding-top:22px;font-size:27px;color:#3f4a63;line-height:1.4\">Limiti e insidie di COMET, arXiv:2408.15366.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"40 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 50px;max-width:1560px\">Valutazione della pipeline complessiva<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:36px;max-width:1540px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Ogni componente ha la sua metrica, e nessuna di loro quantifica l'accettabilità del video finale.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">La misura importante è <strong>su esempi completi e lunghi<\u002Fstrong>, prodotti dalla pipeline complessiva nelle condizioni in cui verrà usata: identità e coerenza del volto tendono a degradarsi con la durata.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Accanto alla misura occorre un elenco di failure mode da cercare esplicitamente, perché nessuna metrica li rileva: la frase inventata dal riconoscimento, il nome proprio tradotto, la bocca che si muove durante un silenzio, il volto che salta a un cambio di inquadratura.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">L'elenco nasce dai failure mode osservati, e cresce con l'uso del sistema.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"41 Divisoria\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 5<\u002Fp>\n    <h2 style=\"margin:0;font-size:160px;font-weight:700;letter-spacing:-5px;line-height:1.05;max-width:1560px\">Produzione e vincoli legali<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"42 Definizione\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 36px;max-width:1560px\">Real-time factor e latenza iniziale<\u002Fh2>\n  <div data-enter=\"rise\">\n    <div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:36px 48px;max-width:1560px\"><p style=\"margin:0;font-size:42px;line-height:1.3\">Il <strong>real-time factor<\u002Fstrong> è il tempo di calcolo diviso la durata dell'audio prodotto. La <strong>latenza iniziale<\u002Fstrong> è l'attesa fra la richiesta e l'inizio del suono.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;max-width:1540px;margin-top:40px\">\n      <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">un real-time factor minore di 1 significa che il sistema produce l'audio più in fretta di quanto l'audio duri<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">sulla stessa GPU, un modello leggero con un parlante fissato sta intorno a <strong>0,04<\u002Fstrong>, un modello di voice cloning zero-shot intorno a <strong>0,3<\u002Fstrong><\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">i sistemi in streaming, che mandano in riproduzione l'audio mentre generano il resto, arrivano a <strong>un centinaio di millisecondi<\u002Fstrong> di latenza iniziale<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:34px;line-height:1.35;max-width:1620px\">Quanta attesa è ammessa dipende dall'applicazione, e il modello è scelto dopo, entro quel limite.<\u002Fp>\n  <div style=\"margin-top:28px;border-top:2px solid #d4d7de;padding-top:20px;font-size:27px;color:#3f4a63;line-height:1.4\">Real-time factor su GPU RTX 3090, da Matcha-TTS, arXiv:2309.03199, e F5-TTS, arXiv:2410.06885.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"43 Grafico\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 24px;max-width:1560px\">Detection della voce sintetica e filigrana<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:1fr 760px;gap:60px\" data-enter=\"rise\">\n    <div style=\"position:relative;min-height:0\"><div style=\"position:absolute;top:0;left:0;right:0;bottom:0;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" role=\"img\" aria-label=\"Tasso di errore dei detector di voce sintetica: sulla stessa raccolta dell'addestramento 1,2 % per il miglior modello e 9,9 % in media; su audio raccolto in rete 37 % e 60 %, oltre la linea della scelta casuale al 50 %\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" sc-camel-view-box=\"0 0 427.929609 290.541742\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n \n <defs>\n  \n <\u002Fdefs>\n <g id=\"figure_1\">\n  <g id=\"patch_1\">\n   <path d=\"M 0 290.541742  L 427.929609 290.541742  L nherit; fill: var(--ink, #14213d)\" transform=\"translate(89.519448 279.768256)\">dell'addestramento<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"xtick_2\">\n     <g id=\"line2d_2\">\n      <g>\n       <use href=\"#m9f4a160aee\" x=\"321.352467\" y=\"251.136\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_2\">\n      <text style=\"font-size: 11.55px; font-family: inherit; fill: var(--ink, #14213d)\" transform=\"translate(284.045474 267.165385)\">audio raccolto<\u002Ftext>\n      <text style=\"font-size: 11.55px; font-family: inherit; fill: var(--ink, #14213d)\" transform=\"translate(304.336724 279.768256)\">in rete<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n   <\u002Fg>\n   <g id=\"matplotlib.axis_2\">\n    <g id=\"ytick_1\">\n     <g id=\"line2d_3\">\n      <path d=\"M 41.289609 251.136  L 420.729609 251.136  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-opacity: 0.22; stroke-width: 0.8; stroke-linecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_4\">\n      <defs>\n       <path id=\"m3552979390\" d=\"M 0 0  L -3.5 0  \" style=\"stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fpath>\n      <\u002Fdefs>\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"251.136\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_3\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-anchor: end; fill: var(--muted, #4d5a78)\" x=\"34.289609\" y=\"254.744887\" transform=\"rotate(-0 34.289609 254.744887)\">0<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"ytick_2\">\n     <g id=\"line2d_5\">\n      <path d=\"M 41.289609 219.039158  L 420.729609 219.039158  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-opacity: 0.22; stroke-width: 0.8; stroke-linecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_6\">\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"219.039158\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_4\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-anchor: end; fill: var(--muted, #4d5a78)\" x=\"34.289609\" y=\"222.648045\" transform=\"rotate(-0 34.289609 222.648045)\">10<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"ytick_3\">\n     <g id=\"line2d_7\">\n      <path d=\"M 41.289609 186.942316  L 420.729609 186.942316  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-opacity: 0.22; stroke-width: 0.8; stroke-linecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_8\">\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"186.942316\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_5\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-anchor: end; fill: var(--muted, #4d5a78)\" x=\"34.289609\" y=\"190.551203\" transform=\"rotate(-0 34.289609 190.551203)\">20<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"ytick_4\">\n     <g id=\"line2d_9\">\n      <path d=\"M 41.289609 154.845474  L 420.729609 154.845474  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-opacity: 0.22; stroke-width: 0.8; stroke-linecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_10\">\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"154.845474\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_6\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-ancho inecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_16\">\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"58.554947\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_9\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-anchor: end; fill: var(--muted, #4d5a78)\" x=\"34.289609\" y=\"62.163834\" transform=\"rotate(-0 34.289609 62.163834)\">60<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"ytick_8\">\n     <g id=\"line2d_17\">\n      <path d=\"M 41.289609 26.458105  L 420.729609 26.458105  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-opacity: 0.22; stroke-width: 0.8; stroke-linecap: square\"><\u002Fpath>\n     <\u002Fg>\n     <g id=\"line2d_18\">\n      <g>\n       <use href=\"#m3552979390\" x=\"41.289609\" y=\"26.458105\" style=\"fill: var(--muted, #4d5a78); stroke: var(--muted, #4d5a78); stroke-width: 0.8\"><\u002Fuse>\n      <\u002Fg>\n     <\u002Fg>\n     <g id=\"text_10\">\n      <text style=\"font-size: 10.45px; font-family: inherit; text-anchor: end; fill: var(--muted, #4d5a78)\" x=\"34.289609\" y=\"30.066992\" transform=\"rotate(-0 34.289609 30.066992)\">70<\u002Ftext>\n     <\u002Fg>\n    <\u002Fg>\n    <g id=\"text_11\">\n     <text style=\"font-size: 12.10px; font-family: inherit; text-anchor: middle; fill: var(--ink, #14213d)\" x=\"15.558281\" y=\"129.168\" transform=\"rotate(-90 15.558281 129.168)\">tasso di errore, EER (%)<\u002Ftext>\n    <\u002Fg>\n   <\u002Fg>\n   <g id=\"line2d_19\">\n    <path d=\"M 41.289609 90.651789  L 420.729609 90.651789  \" clip-path=\"url(#p2ad065a898)\" style=\"fill: none; stroke-dasharray: 6.5,5.2; stroke-dashoffset: 0; stroke: var(--ink, #14213d); stroke-width: 1.3\"><\u002Fpath>\n   <\u002Fg>\n   <g id=\"patch_7\">\n    <path d=\"M 41.289609 251.136  L 41.289609 7.2  \" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-linejoin: miter; stroke-linecap: square\"><\u002Fpath>\n   <\u002Fg>\n   <g id=\"patch_8\">\n    <path d=\"M 41.289609 251.136  L 420.729609 251.136  \" style=\"fill: none; stroke: var(--muted, #4d5a78); stroke-linejoin: miter; stroke-linecap: square\"><\u002Fpath>\n   <\u002Fg>\n   <g id=\"text_12\">\n    <text style=\"font-weight: 700; font-size: 13.20px; font-family: inherit; text-anchor: middle; fill: var(--accent, #2f6bff)\" x=\"109.950181\" y=\"239.814928\" transform=\"rotate(-0 109.950181 239.814928)\">1,2 %<\u002Ftext>\n   <\u002Fg>\n   <g id=\"text_13\">\n    <text style=\"font-weight: 700; font-size: 13.20px; font-family: inherit; text-anchor: middle; fill: var(--accent, #2f6bff)\" x=\"290.635895\" y=\"124.507022\" transform=\"rotate(-0 290.635895 124.507022)\">37 %<\u002Ftext>\n   <\u002Fg>\n   <g id=\"text_14\">\n    <text style=\"font-weight: 700; font-size: 13.20px; font-family: inherit; text-anchor: middle; fill: var(--accent-2, #b8422f)\" x=\"171.383324\" y=\"212.14424\" transform=\"rotate(-0 171.383324 212.14424)\">9,9 %<\u002Ftext>\n   <\u002Fg>\n   <g id=\"text_15\">\n    <text style=\"font-weight: 700; font-size: 13.20px; font-family: inherit; text-anchor: middle; fill: var(--accent-2, #b8422f)\" x=\"352.069038\" y=\"50.857609\" transform=\"rotate(-0 352.069038 50.857609)\">60 %<\u002Ftext>\n   <\u002Fg>\n   <g id=\"text_16\">\n    <text style=\"font-size: 11.00px; font-family: inherit; text-anchor: start; fill: var(--ink, #14213d)\" x=\"50.323895\" y=\"83.755888\" transform=\"rotate(-0 50.323895 83.755888)\">scelta casuale<\u002Ftext>\n   <\u002Fg>\n   <g id=\"legend_1\">\n    <g id=\"patch_9\">\n     <path d=\"M 50.289609 23.798437  L 70.289609 23.798437  L 70.289609 16.798437  L 50.289609 16.798437  z \" style=\"fill: var(--accent, #2f6bff); opacity: 0.85\"><\u002Fpath>\n    <\u002Fg>\n    <g id=\"text_17\">\n     <text style=\"font-size: 11.00px; font-family: inherit; text-anchor: start\" x=\"78.289609\" y=\"23.798437\" transform=\"rotate(-0 78.289609 23.798437)\">miglior modello<\u002Ftext>\n    <\u002Fg>\n    <g id=\"patch_10\">\n     <path d=\"M 50.289609 38.799219  L 70.289609 38.799219  L 70.289609 31.799219  L 50.289609 31.799219  z \" style=\"fill: var(--accent-2, #b8422f); opacity: 0.85\"><\u002Fpath>\n    <\u002Fg>\n    <g id=\"text_18\">\n     <text style=\"font-size: 11.00px; font-family: inherit; text-anchor: start\" x=\"78.289609\" y=\"38.799219\" transform=\"rotate(-0 78.289609 38.799219)\">media dei modelli<\u002Ftext>\n    <\u002Fg>\n   <\u002Fg>\n  <\u002Fg>\n <\u002Fg>\n <defs>\n  <clipPath id=\"p2ad065a898\">\n   <rect x=\"41.289609\" y=\"7.2\" width=\"379.44\" height=\"243.936\"><\u002Frect>\n  <\u002FclipPath>\n <\u002Fdefs>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:22px\">\n      <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:27px;line-height:1.36\">Un detector impara <strong>gli artefatti dei generatori che ha visto<\u002Fstrong>, e quegli artefatti cambiano con l'architettura. Fuori dalla raccolta di addestramento cambiano anche le condizioni di registrazione.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:27px;line-height:1.36\">Nuovi generatori escono di continuo, e un detector in uso incontra <strong>generatori che non ha mai visto<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:27px;line-height:1.36\">La <strong>filigrana<\u002Fstrong> è un marchio impercettibile che chi genera inserisce nel segnale: dichiara la provenienza di un contenuto prodotto in buona fede, ma alcune ricodifiche del segnale la rimuovono senza un peggioramento udibile.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:52px 0 0;font-size:36px;font-weight:700;line-height:1.3;max-width:1660px\">Una voce riconoscibile <span style=\"color:#2f6bff\">non prova più l'identità<\u002Fspan> di chi parla, e la detection automatica non basta a riconoscere una voce falsa.<\u002Fp>\n  <div style=\"margin-top:24px;border-top:2px solid #d4d7de;padding-top:18px;font-size:27px;color:#3f4a63;line-height:1.4\">Generalizzazione dei detector, Müller et al., Interspeech 2022, arXiv:2203.16263; rimozione della filigrana, AudioMarkBench, NeurIPS 2024, arXiv:2406.06979.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"44 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 42px;max-width:1560px\">Articolo 50: marcatura e dichiarazione<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:28px;max-width:1560px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Dal <strong>2 agosto 2026<\u002Fstrong>, i <strong>provider<\u002Fstrong> di sistemi che generano audio, immagini, video o testo sintetici devono marcare l'uscita in <strong>formato leggibile dalla macchina<\u002Fstrong> e renderla rilevabile come generata artificialmente. Per i sistemi già sul mercato prima di quella data il termine è il <strong>2 dicembre 2026<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Dal 2 agosto 2026, i <strong>deployer<\u002Fstrong>, cioè chi usa il sistema in un'attività professionale, devono <strong>dichiarare<\u002Fstrong> che un <strong>deep fake<\u002Fstrong> è stato generato o manipolato artificialmente.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Un deep fake è un'immagine o un contenuto audio o video che somiglia a persone, luoghi o eventi esistenti e che sembrerebbe falsamente autentico. Per un'opera manifestamente artistica, satirica o di finzione la dichiarazione resta, in una forma che non disturba la visione.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">La marcatura è tecnica e la dichiarazione è rivolta a chi guarda: soddisfare l'una non soddisfa l'altra.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:32px;line-height:1.35;max-width:1620px\">In una pipeline di doppiaggio la marcatura tocca al provider, che la costruisce, e la dichiarazione al deployer, che la usa per produrre il video.<\u002Fp>\n  <div style=\"margin-top:26px;border-top:2px solid #d4d7de;padding-top:20px;font-size:27px;color:#3f4a63;line-height:1.4\">AI Act, Regolamento (UE) 2024/1689, articoli 3 e 50, e articolo 111, paragrafo 4, inserito dal Regolamento (UE) 2026/1744.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"45 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 42px;max-width:1560px\">Pratiche vietate e consenso<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:28px;max-width:1560px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Il <strong>riconoscimento delle emozioni sul luogo di lavoro e negli istituti di istruzione a partire da dati biometrici<\u002Fstrong> è vietato dal 2 febbraio 2025, con eccezioni strette per finalità mediche e di sicurezza. <strong>Le caratteristiche della voce rientrano nell'ambito.<\u002Fstrong><\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Clonare la voce di una persona identificabile richiede, nella pratica, il suo <strong>consenso<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Le norme in gioco sono più d'una: protezione dei dati personali, diritti della personalità nei singoli ordinamenti e leggi specifiche sulle repliche vocali generate.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:24px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Un campione vocale raccolto per una finalità non è automaticamente utilizzabile per addestrare un modello che ne riproduce la voce.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:38px;font-weight:700;line-height:1.3;max-width:1620px\">Il consenso deve essere raccolto <span style=\"color:#2f6bff\">prima<\u002Fspan> di produrre il materiale, perché dopo non è più recuperabile.<\u002Fp>\n  <div style=\"margin-top:26px;border-top:2px solid #d4d7de;padding-top:20px;font-size:27px;color:#3f4a63;line-height:1.4\">AI Act, Regolamento (UE) 2024/1689, articolo 5; linee guida della Commissione sulle pratiche vietate, sezione 7.2.2; GDPR, Regolamento (UE) 2016/679, articolo 5.<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
