odellare direttamente.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.38\">Lo spettrogramma mel è l'<strong>energia in bande di frequenza su finestre brevi e successive<\u002Fstrong>, con le bande più fitte dove l'orecchio distingue meglio. Accorcia la sequenza di due ordini di grandezza, resta continuo, ma perde la fase: per tornare al suono serve un modello addestrato.<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.38\"><strong>I token sostituiscono i valori continui con simboli<\u002Fstrong>, al prezzo della perdita introdotta dalla codifica.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"12 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 60px;max-width:1560px\">La rappresentazione discreta e la modellazione di sequenze<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:46px;max-width:1500px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:40px;line-height:1.35\">Una sequenza di simboli da un vocabolario finito è <strong>la stessa forma di dato del testo<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:40px;line-height:1.35\">La sintesi vocale diventa quindi <strong>predizione del simbolo successivo<\u002Fstrong>, e riusa architetture, tecniche di addestramento e forme di condizionamento sviluppate per il testo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:15px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:40px;line-height:1.35\">La conversione fra suono e simboli resta un modello a sé, addestrato una volta e condiviso da tutti i sistemi che generano token.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"13 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:64px 110px 48px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 24px;max-width:1560px\">Quantizzazione vettoriale residua<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Quantizzazione vettoriale residua: un encoder produce un vettore latente, quattro codebook lo codificano uno dopo l'altro lavorando ciascuno sul residuo del precedente, una colonna di barre mostra il residuo che si riduce livello dopo livello, e i quattro simboli formano i token dell'istante\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <text class=\"muted cap\" x=\"115\" y=\"140\" text-anchor=\"middle\">forma d'onda<\u002Ftext>\n  <path class=\"arr\" d=\"M 115 150 V 162\"><\u002Fpath>\n  <path class=\"head\" d=\"M 115 176 l -6 -14 h 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"40\" y=\"176\" width=\"150\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"115\" y=\"208\" text-anchor=\"middle\">encoder<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 190 202 H 236\"><\u002Fpath>\n  <path class=\"head\" d=\"M 246 202 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"tint\" x=\"246\" y=\"152\" width=\"28\" height=\"100\"><\u002Frect>\n  <rect class=\"cont\" x=\"246\" y=\"152\" width=\"28\" height=\"100\"><\u002Frect>\n  <text class=\"muted cap\" x=\"260\" y=\"274\" text-anchor=\"middle\">vettore latente<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 274 202 H 320 V 60 H 380\"><\u002Fpath>\n  <path class=\"head\" d=\"M 390 60 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"tint\" x=\"390\" y=\"38\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"tint\" x=\"390\" y=\"122\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"tint\" x=\"390\" y=\"206\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"tint\" x=\"390\" y=\"290\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"gauge\" x=\"390\" y=\"38\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"gauge\" x=\"390\" y=\"138\" width=\"28\" height=\"28\"><\u002Frect>\n  <rect class=\"gauge\" x=\"390\" y=\"234\" width=\"28\" height=\"16\"><\u002Frect>\n  <rect class=\"gauge\" x=\"390\" y=\"326\" width=\"28\" height=\"8\"><\u002Frect>\n  <rect class=\"cont\" x=\"390\" y=\"38\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"cont\" x=\"390\" y=\"122\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"cont\" x=\"390\" y=\"206\" width=\"28\" height=\"44\"><\u002Frect>\n  <rect class=\"cont\" x=\"390\" y=\"290\" width=\"28\" height=\"44\"><\u002Frect>\n  <text class=\"muted cap\" x=\"380\" y=\"362\" text-anchor=\"middle\">residuo da codificare<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 418 60 H 450\"><\u002Fpath>\n  <path class=\"head\" d=\"M 460 60 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 418 144 H 450\"><\u002Fpath>\n  <path class=\"head\" d=\"M 460 144 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 418 228 H 450\"><\u002Fpath>\n  <path class=\"head\" d=\"M 460 228 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 418 312 H 450\"><\u002Fpath>\n  <path class=\"head\" d=\"M 460 312 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"boxa\" x=\"460\" y=\"34\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"560\" y=\"66\" text-anchor=\"middle\">codebook 1<\u002Ftext>\n  <rect class=\"box\" x=\"460\" y=\"118\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"560\" y=\"150\" text-anchor=\"middle\">codebook 2<\u002Ftext>\n  <rect class=\"box\" x=\"460\" y=\"202\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"560\" y=\"234\" text-anchor=\"middle\">codebook 3<\u002Ftext>\n  <rect class=\"box\" x=\"460\" y=\"286\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"560\" y=\"318\" text-anchor=\"middle\">codebook 4<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 560 86 V 104 H 404 V 112\"><\u002Fpath>\n  <path class=\"head\" d=\"M 404 122 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"470\" y=\"98\">residuo<\u002Ftext>\n  <path class=\"arr\" d=\"M 560 170 V 188 H 404 V 196\"><\u002Fpath>\n  <path class=\"head\" d=\"M 404 206 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"470\" y=\"182\">residuo<\u002Ftext>\n  <path class=\"arr\" d=\"M 560 254 V 272 H 404 V 280\"><\u002Fpath>\n  <path class=\"head\" d=\"M 404 290 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"470\" y=\"266\">residuo<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 660 60 H 720\"><\u002Fpath>\n  <path class=\"head\" d=\"M 730 60 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 660 144 H 720\"><\u002Fpath>\n  <path class=\"head\" d=\"M 730 144 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 660 228 H 720\"><\u002Fpath>\n  <path class=\"head\" d=\"M 730 228 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 660 312 H 720\"><\u002Fpath>\n  <path class=\"head\" d=\"M 730 312 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"boxa\" x=\"730\" y=\"38\" width=\"80\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"770\" y=\"66\" text-anchor=\"middle\">418<\u002Ftext>\n  <rect class=\"box\" x=\"730\" y=\"122\" width=\"80\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"770\" y=\"150\" text-anchor=\"middle\">906<\u002Ftext>\n  <rect class=\"box\" x=\"730\" y=\"206\" width=\"80\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"770\" y=\"234\" text-anchor=\"middle\">173<\u002Ftext>\n  <rect class=\"box\" x=\"730\" y=\"290\" width=\"80\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"770\" y=\"318\" text-anchor=\"middle\">542<\u002Ftext>\n  <text class=\"muted cap\" x=\"770\" y=\"362\" text-anchor=\"middle\">token dell'istante<\u002Ftext>\n\n  <text class=\"muted cap\" x=\"832\" y=\"66\">contenuto e intonazione<\u002Ftext>\n  <text class=\"muted cap\" x=\"832\" y=\"318\">timbro e qualità del suono<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:18px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Un autoencoder comprime il segnale in vettori latenti; la quantizzazione sostituisce ogni vettore con <strong>la voce più vicina di un dizionario finito<\u002Fstrong>, detto <strong>codebook<\u002Fstrong>, e il simbolo è il suo indice.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Un solo codebook perderebbe troppa informazione. Lo stack codifica a ogni livello <strong>il residuo<\u002Fstrong>, cioè la differenza fra il vettore e la sua approssimazione al livello precedente.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Ogni istante di audio è rappresentato da tanti simboli quanti sono i livelli.<\u002Fp><\u002Fdiv><p style=\"margin:0;font-size:32px;font-weight:700;line-height:1.35\">Gli ultimi livelli possono essere scartati senza perdere il contenuto.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"14 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 30px;max-width:1560px\">Il dato video per il lip sync<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 225\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Catena di preparazione del dato video: dal video alla face detection, all'allineamento della regione della bocca e all'associazione temporale fra frame e audio, che insieme formano la preparazione del dato, prima del modello\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"40\" y=\"96\" width=\"200\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"140\" y=\"132\" text-anchor=\"middle\">video<\u002Ftext>\n  <text class=\"muted cap\" x=\"140\" y=\"182\" text-anchor=\"middle\">sequenza di frame<\u002Ftext>\n  <text class=\"muted cap\" x=\"140\" y=\"202\" text-anchor=\"middle\">e traccia audio<\u002Ftext>\n  <rect class=\"box\" x=\"280\" y=\"96\" width=\"200\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"380\" y=\"132\" text-anchor=\"middle\">face detection<\u002Ftext>\n  <text class=\"muted cap\" x=\"380\" y=\"182\" text-anchor=\"middle\">posizione del volto<\u002Ftext>\n  <text class=\"muted cap\" x=\"380\" y=\"202\" text-anchor=\"middle\">in ogni frame<\u002Ftext>\n  <rect class=\"box\" x=\"520\" y=\"96\" width=\"200\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"620\" y=\"132\" text-anchor=\"middle\">allineamento<\u002Ftext>\n  <text class=\"muted cap\" x=\"620\" y=\"182\" text-anchor=\"middle\">regione della bocca ritagliata<\u002Ftext>\n  <text class=\"muted cap\" x=\"620\" y=\"202\" text-anchor=\"middle\">e portata in posizione fissa<\u002Ftext>\n  <rect class=\"box\" x=\"760\" y=\"96\" width=\"200\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"860\" y=\"132\" text-anchor=\"middle\">associazione temporale<\u002Ftext>\n  <text class=\"muted cap\" x=\"860\" y=\"182\" text-anchor=\"middle\">corrispondenza fra frame<\u002Ftext>\n  <text class=\"muted cap\" x=\"860\" y=\"202\" text-anchor=\"middle\">e finestre di audio<\u002Ftext>\n  <path class=\"arr\" d=\"M 240 126 H 268\"><\u002Fpath>\n  <path class=\"head\" d=\"M 280 126 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 480 126 H 508\"><\u002Fpath>\n  <path class=\"head\" d=\"M 520 126 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 720 126 H 748\"><\u002Fpath>\n  <path class=\"head\" d=\"M 760 126 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"tratt\" d=\"M 280 72 H 960 M 280 72 V 88 M 960 72 V 88\"><\u002Fpath>\n  <text class=\"acc cap\" x=\"620\" y=\"58\" text-anchor=\"middle\">preparazione del dato<\u002Ftext>\n  <path class=\"arr\" d=\"M 960 126 H 988\"><\u002Fpath>\n  <path class=\"head\" d=\"M 1000 126 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"1000\" y=\"96\" width=\"110\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"1055\" y=\"132\" text-anchor=\"middle\">modello<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:28px;margin-top:40px;max-width:1600px\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">Il modello di lip sync riceve <strong>solo la regione della bocca<\u002Fstrong>, già ritagliata e allineata.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">L'allineamento porta la bocca sempre nella stessa posizione, così il modello non deve anche localizzarla.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"15 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Failure mode della preparazione del dato video<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:38px;max-width:1520px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Volto parzialmente coperto<\u002Fstrong>: una mano, un microfono o un oggetto davanti alla bocca producono una regione ritagliata che non contiene la bocca.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Volto di profilo<\u002Fstrong>: la bocca è visibile in scorcio o non è visibile, e l'allineamento restituisce una regione non confrontabile con quelle frontali.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Più volti nell'inquadratura<\u002Fstrong>: la preparazione deve stabilire quale volto sta parlando.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:13px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:36px;line-height:1.35\"><strong>Cambio di inquadratura<\u002Fstrong>: il volto salta di posizione fra due frame consecutivi, e il modello li tratta comunque come una sequenza continua.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"16 Tabella\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Addestrare, adattare, clonare: materiale necessario<\u002Fh2>\n  <div data-enter=\"rise\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px 0;border-bottom:4px solid #14213d;font-weight:700;width:26%\">Scopo<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700;width:32%\">Materiale<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700\">Addestramento<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 18px 24px;border-bottom:4px solid #14213d;font-weight:700\">Requisiti<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:34px;font-weight:700;padding:26px 24px 26px 0;border-bottom:2px solid #d4d7de\">addestrare da zero<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:26px 24px;border-bottom:2px solid #d4d7de\">migliaia di ore, molti parlanti<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:26px 24px;border-bottom:2px solid #d4d7de\">completo<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;color:#4d5a78;padding:26px 0 26px 24px;border-bottom:2px solid #d4d7de\">infrastruttura dedicata<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"font-size:34px;font-weight:700;padding:26px 24px 26px 0;border-bottom:2px solid #d4d7de\">adattare a una voce<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:26px 24px;border-bottom:2px solid #d4d7de\">da pochi minuti a poche ore della stessa voce<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:26px 24px;border-bottom:2px solid #d4d7de\">fine-tuning<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;color:#4d5a78;padding:26px 0 26px 24px;border-bottom:2px solid #d4d7de\">dati e GPU<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#dfe9ff\"><sc-raw-td style=\"font-size:34px;font-weight:700;padding:26px 24px 26px 0;border-bottom:2px solid #d4d7de\"><span style=\"padding-left:24px\">clonare in zero-shot<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;font-weight:700;color:#1c4fd8;padding:26px 24px;border-bottom:2px solid #d4d7de\">pochi secondi<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:26px 24px;border-bottom:2px solid #d4d7de\">nessuno<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;color:#3a4a70;padding:26px 0 26px 24px;border-bottom:2px solid #d4d7de\">modello zero-shot<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:36px;line-height:1.35;max-width:1600px\">Con il voice cloning in zero-shot, pochi secondi di una registrazione pubblica bastano a produrre una voce ragionevolmente naturale e simile all'originale.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"17 Divisoria\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 3<\u002Fp>\n    <h2 style=\"margin:0;font-size:124px;font-weight:700;letter-spacing:-3px;line-height:1.06;max-width:1560px\">La voce: sintesi, voice cloning e conversione<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"18 Colonne\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Baseline: sintesi concatenativa e parametrica<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:90px\" data-enter=\"rise\">\n    <div>\n      <p style=\"margin:0 0 18px;font-size:44px;font-weight:700;line-height:1.15\">Concatenativa<\u002Fp>\n      <div style=\"height:4px;background:#14213d;margin-bottom:34px\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:26px\">\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">frammenti di parlato registrato, selezionati e concatenati<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">intelligibile, e con giunzioni udibili fra un frammento e l'altro<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">la voce è quella del parlante registrato: una voce nuova richiede una nuova campagna di registrazione<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <p style=\"margin:0 0 18px;font-size:44px;font-weight:700;line-height:1.15\">Parametrica<\u002Fp>\n      <div style=\"height:4px;background:#14213d;margin-bottom:34px\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:26px\">\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">un modello statistico predice i parametri da cui il segnale è sintetizzato<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">fluida, priva di giunzioni, e con un timbro sordo riconoscibile<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:11px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:32px;line-height:1.35\">la voce è controllabile per parametri, entro un margine stretto<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:46px;font-weight:700;line-height:1.3;max-width:1620px\">Il criterio di qualità è passato dall'<span style=\"color:#2f6bff\">intelligibilità<\u002Fspan> alla <span style=\"color:#2f6bff\">naturalezza<\u002Fspan>, e le metriche costruite per la prima non misurano la seconda.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"19 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 26px;max-width:1560px\">Architettura a due stadi: modello acustico e vocoder<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 250\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Architettura a due stadi della sintesi vocale: dal testo al modello acustico, che produce uno spettrogramma mel, e dal vocoder alla forma d'onda; il ritorno dal vocoder al modello acustico è barrato perché non esiste\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <text class=\"ros cap\" x=\"585\" y=\"34\" text-anchor=\"middle\">nessun ritorno: i due stadi sono addestrati separatamente<\u002Ftext>\n  <path class=\"tratt\" d=\"M 820 118 V 62 H 362\"><\u002Fpath>\n  <path class=\"headm\" d=\"M 350 62 l 14 -6 v 12 Z\"><\u002Fpath>\n  <path d=\"M 574 52 l 22 20 M 574 72 l 22 -20\" fill=\"none\" stroke=\"var(--accent-2, #b8422f)\" stroke-width=\"2\"><\u002Fpath>\n  <rect class=\"box\" x=\"30\" y=\"118\" width=\"160\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"110\" y=\"154\" text-anchor=\"middle\">testo<\u002Ftext>\n  <path class=\"arr\" d=\"M 202 148 H 228\"><\u002Fpath>\n  <path class=\"head\" d=\"M 240 148 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"240\" y=\"118\" width=\"220\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"350\" y=\"154\" text-anchor=\"middle\">modello acustico<\u002Ftext>\n  <path class=\"arr\" d=\"M 472 148 H 498\"><\u002Fpath>\n  <path class=\"head\" d=\"M 510 148 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"boxa\" x=\"510\" y=\"130\" width=\"180\" height=\"36\" rx=\"3\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"600\" y=\"154\" text-anchor=\"middle\">spettrogramma mel<\u002Ftext>\n  <path class=\"arr\" d=\"M 702 148 H 728\"><\u002Fpath>\n  <path class=\"head\" d=\"M 740 148 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"740\" y=\"118\" width=\"160\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"820\" y=\"154\" text-anchor=\"middle\">vocoder<\u002Ftext>\n  <path class=\"arr\" d=\"M 912 148 H 938\"><\u002Fpath>\n  <path class=\"head\" d=\"M 950 148 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"950\" y=\"118\" width=\"160\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"1030\" y=\"154\" text-anchor=\"middle\">forma d'onda<\u002Ftext>\n  <text class=\"muted cap\" x=\"350\" y=\"206\" text-anchor=\"middle\">problema linguistico<\u002Ftext>\n  <text class=\"muted cap\" x=\"350\" y=\"226\" text-anchor=\"middle\">contenuto e intonazione<\u002Ftext>\n  <text class=\"muted cap\" x=\"600\" y=\"206\" text-anchor=\"middle\">rappresentazione<\u002Ftext>\n  <text class=\"muted cap\" x=\"600\" y=\"226\" text-anchor=\"middle\">intermedia, continua<\u002Ftext>\n  <text class=\"muted cap\" x=\"820\" y=\"206\" text-anchor=\"middle\">problema di segnale<\u002Ftext>\n  <text class=\"muted cap\" x=\"820\" y=\"226\" text-anchor=\"middle\">qualità del suono<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:32px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">La separazione permette di addestrare i due stadi su materiale diverso: il vocoder richiede solo audio, senza trascrizione.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Ciascuno stadio è sostituibile senza riaddestrare l'altro, e lo stesso vocoder serve modelli acustici diversi.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">È l'architettura ancora scelta quando la velocità conta più della qualità.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"20 Definizione\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 44px;max-width:1560px\">Voice cloning zero-shot<\u002Fh2>\n  <div data-enter=\"rise\">\n    <div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:42px 52px;max-width:1560px\"><p style=\"margin:0;font-size:50px;line-height:1.3\">Dato un testo e pochi secondi di registrazione di un parlante, produrre il parlato di quel testo con la voce di quel parlante, senza addestramento aggiuntivo.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:26px;max-width:1520px;margin-top:52px\">\n      <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\"><strong>zero-shot<\u002Fstrong>: il parlante di riferimento non compare nel materiale su cui il modello è stato addestrato<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">dal campione il modello prende l'identità vocale, e il testo da leggere è indipendente da quello che il campione dice<\u002Fp><\u002Fdiv>\n      <div style=\"display:flex;gap:26px;align-items:flex-start\"><div style=\"width:14px;height:14px;background:#2f6bff;margin-top:12px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:34px;line-height:1.35\">la qualità dipende dalla <strong>pulizia del campione<\u002Fstrong> più che dalla sua durata<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"21 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 22px;max-width:1560px\">Il modello di linguaggio sui token audio<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 270\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Voice cloning con un modello di linguaggio sui token: il testo da leggere e i token ricavati da pochi secondi della voce da imitare entrano nel modello, che predice il simbolo successivo; i token generati tornano audio e danno il parlato con la voce del campione\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"30\" y=\"40\" width=\"230\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"145\" y=\"72\" text-anchor=\"middle\">testo da leggere<\u002Ftext>\n  <rect class=\"boxa\" x=\"30\" y=\"170\" width=\"230\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"145\" y=\"202\" text-anchor=\"middle\">campione di riferimento<\u002Ftext>\n  <text class=\"muted cap\" x=\"145\" y=\"246\" text-anchor=\"middle\">pochi secondi della voce da imitare<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 260 196 H 276\"><\u002Fpath>\n  <path class=\"head\" d=\"M 290 196 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"290\" y=\"170\" width=\"160\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"370\" y=\"202\" text-anchor=\"middle\">da audio a token<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 260 66 H 476\"><\u002Fpath>\n  <path class=\"head\" d=\"M 490 66 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 450 196 H 476\"><\u002Fpath>\n  <path class=\"head\" d=\"M 490 196 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"490\" y=\"40\" width=\"230\" height=\"182\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"605\" y=\"120\" text-anchor=\"middle\">modello di linguaggio<\u002Ftext>\n  <text class=\"ink lbl\" x=\"605\" y=\"142\" text-anchor=\"middle\">sui token<\u002Ftext>\n  <text class=\"muted cap\" x=\"605\" y=\"176\" text-anchor=\"middle\">predice il simbolo successivo<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 720 131 H 736\"><\u002Fpath>\n  <path class=\"head\" d=\"M 750 131 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"750\" y=\"109\" width=\"40\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink cap\" x=\"770\" y=\"137\" text-anchor=\"middle\">77<\u002Ftext>\n  <rect class=\"box\" x=\"795\" y=\"109\" width=\"40\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink cap\" x=\"815\" y=\"137\" text-anchor=\"middle\">512<\u002Ftext>\n  <rect class=\"box\" x=\"840\" y=\"109\" width=\"40\" height=\"44\" rx=\"4\"><\u002Frect>\n  <text class=\"ink cap\" x=\"860\" y=\"137\" text-anchor=\"middle\">903<\u002Ftext>\n  <text class=\"muted cap\" x=\"815\" y=\"176\" text-anchor=\"middle\">token generati<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 880 131 H 896\"><\u002Fpath>\n  <path class=\"head\" d=\"M 910 131 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"910\" y=\"105\" width=\"160\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"990\" y=\"137\" text-anchor=\"middle\">da token ad audio<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 990 157 V 182\"><\u002Fpath>\n  <path class=\"head\" d=\"M 990 196 l -6 -14 h 12 Z\"><\u002Fpath>\n  <text class=\"ink cap\" x=\"990\" y=\"218\" text-anchor=\"middle\">parlato con la voce del campione<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:26px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">Il campione di riferimento è dato in ingresso insieme al testo, e il modello continua la sequenza con la voce del campione, e anche con il suo rumore di fondo.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\"><strong>Nessun peso viene modificato<\u002Fstrong>: l'adattamento alla voce sta tutto nel contesto.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;gap:22px;align-items:flex-start\"><div style=\"width:13px;height:13px;background:#2f6bff;margin-top:10px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:28px;line-height:1.35\">La capacità di imitare una voce nuova <strong>viene dall'addestramento su molti parlanti<\u002Fstrong>.<\u002Fp><\u002Fdiv><p style=\"margin:0;font-size:30px;line-height:1.35\">Anche le risorse di calcolo richieste sono modeste: il modello è scaricabile già addestrato e gira su un computer ordinario.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:26px;border-top:2px solid #d4d7de;padding-top:20px;font-size:27px;color:#3f4a63;line-height:1.4\">VALL-E, Wang et al., arXiv:2301.02111.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"22 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 68px;max-width:1560px\">Controllo della sintesi: prosodia, emozione e lingua<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:52px;max-width:1500px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:17px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:42px;line-height:1.35\">I sistemi di sintesi con voice cloning accettano indicazioni sulla <strong>prosodia<\u002Fstrong> — velocità, enfasi, pause, intonazione — sul registro emotivo e sull'accento, e possono leggere in una lingua diversa da quella del campione di riferimento.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:17px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:42px;line-height:1.35\">Il controllo è <strong>indiretto<\u002Fstrong>: passa per un campione di riferimento, per etichette grossolane o per una descrizione a parole.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"23 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:64px 110px 48px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 20px;max-width:1560px\">Conversione della voce e disentanglement<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 310\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Conversione della voce: il parlato di partenza è separato in contenuto e identità; l'identità di partenza è scartata, quella di destinazione viene da un campione dell'altro parlante, e la sintesi le ricombina nel parlato di arrivo\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"30\" y=\"125\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"130\" y=\"157\" text-anchor=\"middle\">parlato di partenza<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 230 151 H 260 M 260 86 V 216 M 260 86 H 276 M 260 216 H 276\"><\u002Fpath>\n  <path class=\"head\" d=\"M 290 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"head\" d=\"M 290 216 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"box\" x=\"290\" y=\"60\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"390\" y=\"92\" text-anchor=\"middle\">contenuto<\u002Ftext>\n  <text class=\"muted cap\" x=\"390\" y=\"136\" text-anchor=\"middle\">parole, ritmo, intonazione:<\u002Ftext>\n  <text class=\"muted cap\" x=\"390\" y=\"154\" text-anchor=\"middle\">varia nel tempo<\u002Ftext>\n\n  <rect class=\"box\" x=\"290\" y=\"190\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"muted lbl\" x=\"390\" y=\"222\" text-anchor=\"middle\">identità di partenza<\u002Ftext>\n  <text class=\"muted cap\" x=\"390\" y=\"266\" text-anchor=\"middle\">timbro, qualità della voce:<\u002Ftext>\n  <text class=\"muted cap\" x=\"390\" y=\"284\" text-anchor=\"middle\">costante nel tempo<\u002Ftext>\n  <path class=\"croce\" d=\"M 510 204 L 534 228 M 534 204 L 510 228\"><\u002Fpath>\n  <text class=\"ros cap\" x=\"544\" y=\"222\">scartata<\u002Ftext>\n\n  <rect class=\"boxa\" x=\"640\" y=\"190\" width=\"220\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"750\" y=\"222\" text-anchor=\"middle\">identità di destinazione<\u002Ftext>\n  <text class=\"muted cap\" x=\"750\" y=\"266\" text-anchor=\"middle\">da un campione<\u002Ftext>\n  <text class=\"muted cap\" x=\"750\" y=\"284\" text-anchor=\"middle\">dell'altro parlante<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 490 86 H 646\"><\u002Fpath>\n  <path class=\"head\" d=\"M 660 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 750 190 V 126\"><\u002Fpath>\n  <path class=\"head\" d=\"M 750 112 l -6 14 h 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"660\" y=\"60\" width=\"180\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"750\" y=\"92\" text-anchor=\"middle\">sintesi<\u002Ftext>\n\n  <path class=\"arr\" d=\"M 840 86 H 876\"><\u002Fpath>\n  <path class=\"head\" d=\"M 890 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"890\" y=\"60\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"990\" y=\"92\" text-anchor=\"middle\">parlato di arrivo<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:16px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">La separazione fra <strong>contenuto<\u002Fstrong> e <strong>identità<\u002Fstrong> del parlante, detta <strong>disentanglement<\u002Fstrong>, è il meccanismo su cui sono costruiti i sistemi di conversione.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">«Stesso suono» vuol dire la stessa vocale o la stessa consonante. Il metodo confronta i frammenti su una rappresentazione che dipende da quale suono si pronuncia e poco da chi lo pronuncia, e sceglie il frammento dell'altro parlante più vicino.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Un metodo semplice, <strong>kNN-VC<\u002Fstrong>, sostituisce ogni frammento del parlato di partenza con lo <strong>stesso suono<\u002Fstrong> preso da una registrazione dell'altro parlante, e un vocoder riporta il risultato in audio.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">La separazione è <strong>imperfetta<\u002Fstrong>: parte dell'identità resta nella rappresentazione del contenuto.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">La conversione cambia solo la voce di una registrazione esistente: parole, pause ed enfasi restano quelle originali. Per far dire parole diverse serve la sintesi.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:12px;border-top:2px solid #d4d7de;padding-top:12px;font-size:27px;color:#3f4a63;line-height:1.4\">kNN-VC, Baas, van Niekerk e Kamper, Interspeech 2023, arXiv:2305.18975.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"24 Divisoria\" style=\"background:#14213d;color:#ffffff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:rgba(255,255,255,.45)\"><\u002Fdiv><\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center\" data-enter=\"rise\">\n    <p style=\"margin:0 0 36px;font-size:36px;font-weight:700;letter-spacing:6px;color:#8fb0ff\">PASSO 3.5<\u002Fp>\n    <h2 style=\"margin:0;font-size:150px;font-weight:700;letter-spacing:-4px;line-height:1.05;max-width:1560px\">Il video: lip sync e traduzione<\u002Fh2>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"25 Definizione\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 0;max-width:1560px\">Lip sync<\u002Fh2>\n  <div style=\"flex:1;display:flex;align-items:center\" data-enter=\"rise\">\n    <div style=\"background:#dfe9ff;border:3px solid #14213d;border-radius:16px;padding:56px 64px;max-width:1600px\"><p style=\"margin:0;font-size:58px;line-height:1.3\">Dato un video di una persona che parla e una traccia audio diversa da quella originale, modificare la regione della bocca perché sia coerente con il nuovo audio, e lasciare invariato tutto il resto.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"26 Elenco\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 56px;max-width:1560px\">Difficoltà del lip sync<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:42px;max-width:1520px\" data-enter=\"rise\">\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>L'occhio rileva un audio in anticipo sulle labbra già di poche decine di millisecondi<\u002Fstrong>, cioè dell'ordine della durata di un frame.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>Chi ascolta guarda la bocca<\u002Fstrong>, che è proprio la regione riscritta dal modello: ogni artefatto cade dove l'attenzione è concentrata.<\u002Fp><\u002Fdiv>\n    <div style=\"display:flex;gap:30px;align-items:flex-start\"><div style=\"width:16px;height:16px;background:#2f6bff;margin-top:14px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:38px;line-height:1.35\"><strong>L'identità dipende da dettagli piccoli.<\u002Fstrong> Una modifica alla forma del mento o dei denti fa sembrare la persona un'altra.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:auto 0 0;font-size:36px;line-height:1.35;max-width:1600px\">L'errore fra i frame generati e quelli originali non misura nessuna di queste difficoltà.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"27 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:64px 110px 48px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:34px 0 20px;max-width:1560px\">L'esperto di sincronia come discriminatore<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 360\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"L'esperto di sincronia come discriminatore: il generatore riceve audio e regione della bocca, e i frame generati sono giudicati da un discriminatore di qualità e da un esperto di sincronia pre-addestrato, che rimanda al generatore il segnale di addestramento\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"30\" y=\"60\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"130\" y=\"92\" text-anchor=\"middle\">audio<\u002Ftext>\n  <rect class=\"box\" x=\"30\" y=\"180\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"130\" y=\"204\" text-anchor=\"middle\">regione della bocca<\u002Ftext>\n  <text class=\"ink lbl\" x=\"130\" y=\"224\" text-anchor=\"middle\">da riscrivere<\u002Ftext>\n  <path class=\"arr\" d=\"M 230 86 H 326\"><\u002Fpath>\n  <path class=\"head\" d=\"M 340 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 230 206 H 326\"><\u002Fpath>\n  <path class=\"head\" d=\"M 340 206 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"340\" y=\"60\" width=\"200\" height=\"172\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"440\" y=\"152\" text-anchor=\"middle\">generatore<\u002Ftext>\n  <path class=\"arr\" d=\"M 540 146 H 588\"><\u002Fpath>\n  <path class=\"head\" d=\"M 600 146 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"600\" y=\"116\" width=\"180\" height=\"60\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"690\" y=\"146\" text-anchor=\"middle\">frame<\u002Ftext>\n  <text class=\"ink lbl\" x=\"690\" y=\"166\" text-anchor=\"middle\">generati<\u002Ftext>\n  <path class=\"arr\" d=\"M 792 146 H 830 V 66 H 856\"><\u002Fpath>\n  <path class=\"head\" d=\"M 868 66 l -14 -6 v 12 Z\"><\u002Fpath>\n  <path class=\"arr\" d=\"M 792 146 H 830 V 226 H 856\"><\u002Fpath>\n  <path class=\"head\" d=\"M 868 226 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"868\" y=\"38\" width=\"230\" height=\"56\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"983\" y=\"72\" text-anchor=\"middle\">discriminatore di qualità<\u002Ftext>\n  <text class=\"muted cap\" x=\"983\" y=\"114\" text-anchor=\"middle\">l'immagine è verosimile<\u002Ftext>\n  <rect class=\"boxa\" x=\"868\" y=\"198\" width=\"230\" height=\"56\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"983\" y=\"232\" text-anchor=\"middle\">esperto di sincronia<\u002Ftext>\n  <text class=\"muted cap\" x=\"983\" y=\"274\" text-anchor=\"middle\">audio e labbra corrispondono<\u002Ftext>\n  <text class=\"muted cap\" x=\"983\" y=\"294\" text-anchor=\"middle\">rete addestrata prima e tenuta fissa<\u002Ftext>\n  <path class=\"tratt\" d=\"M 1098 66 H 1112 V 320 H 440 V 246\"><\u002Fpath>\n  <path class=\"tratt\" d=\"M 1098 226 H 1112\"><\u002Fpath>\n  <path class=\"headm\" d=\"M 440 232 l -6 14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"700\" y=\"342\" text-anchor=\"middle\">segnale di addestramento<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:16px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Il generatore di <strong>Wav2Lip<\u002Fstrong> è addestrato con il giudizio di due reti, dette <strong>discriminatori<\u002Fstrong>: una giudica se l'immagine è verosimile, l'altra, l'<strong>esperto di sincronia<\u002Fstrong>, se le labbra corrispondono all'audio.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">L'esperto di sincronia, invece, è addestrato prima, su video reali, e durante l'addestramento del generatore resta <strong>fisso<\u002Fstrong>: fornisce un segnale che il solo confronto frame per frame non dà.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Il discriminatore di qualità forma con il generatore una <strong>GAN<\u002Fstrong> (generative adversarial network): i due sono addestrati insieme, il discriminatore a distinguere i frame veri da quelli generati, il generatore a produrre frame che il discriminatore non distingue.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:24px;line-height:1.24\">Senza l'esperto di sincronia il generatore produce immagini verosimili e labbra che non seguono l'audio.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:12px;border-top:2px solid #d4d7de;padding-top:12px;font-size:27px;color:#3f4a63;line-height:1.4\">Wav2Lip, Prajwal, Mukhopadhyay, Namboodiri e Jawahar, ACM Multimedia 2020, arXiv:2008.10010.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"28 Tabella\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 80px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 60px;max-width:1560px\">Evoluzione dei modelli per il lip sync<\u002Fh2>\n  <div data-enter=\"rise\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px 0;border-bottom:4px solid #14213d;font-weight:700;width:16%\">Periodo<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700;width:18%\">Famiglia<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 24px 18px;border-bottom:4px solid #14213d;font-weight:700\">Che cosa ha aggiunto<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-size:28px;letter-spacing:2px;text-transform:uppercase;color:#4d5a78;padding:0 0 18px 24px;border-bottom:4px solid #14213d;font-weight:700;width:22%\">Generazione<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"font-size:36px;font-weight:700;padding:32px 24px 32px 0;border-bottom:2px solid #d4d7de\">2020<\u002Fsc-raw-td><sc-raw-td style=\"font-size:36px;padding:32px 24px;border-bottom:2px solid #d4d7de\">GAN<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:32px 24px;border-bottom:2px solid #d4d7de\">sincronia affidabile su un volto qualsiasi, ma a bassa risoluzione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;color:#4d5a78;padding:32px 0 32px 24px;border-bottom:2px solid #d4d7de\">una passata della rete<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#dfe9ff\"><sc-raw-td style=\"font-size:36px;font-weight:700;padding:32px 24px 32px 0;border-bottom:2px solid #d4d7de\"><span style=\"padding-left:24px\">2024–2025<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-size:36px;font-weight:700;color:#1c4fd8;padding:32px 24px;border-bottom:2px solid #d4d7de\">diffusione<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;padding:32px 24px;border-bottom:2px solid #d4d7de\">dettaglio di labbra e denti, risoluzione più alta<\u002Fsc-raw-td><sc-raw-td style=\"font-size:32px;color:#3a4a70;padding:32px 0 32px 24px;border-bottom:2px solid #d4d7de\">decine di passate della rete<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"29 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 22px;max-width:1560px\">GAN: generatore e discriminatore<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 30 1120 300\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"GAN: il generatore trasforma un rumore casuale in un'immagine generata; il discriminatore riceve l'immagine generata e le immagini vere e stima la probabilità che l'immagine sia vera; il suo giudizio torna al generatore come segnale di addestramento\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <rect class=\"box\" x=\"30\" y=\"60\" width=\"190\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"125\" y=\"92\" text-anchor=\"middle\">rumore casuale<\u002Ftext>\n  <path class=\"arr\" d=\"M 220 86 H 248\"><\u002Fpath>\n  <path class=\"head\" d=\"M 260 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"boxa\" x=\"260\" y=\"60\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"360\" y=\"92\" text-anchor=\"middle\">generatore<\u002Ftext>\n  <path class=\"arr\" d=\"M 460 86 H 498\"><\u002Fpath>\n  <path class=\"head\" d=\"M 510 86 l -14 -6 v 12 Z\"><\u002Fpath>\n  <rect class=\"box\" x=\"510\" y=\"60\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"610\" y=\"92\" text-anchor=\"middle\">immagine generata<\u002Ftext>\n  <path class=\"arr\" d=\"M 710 86 H 778\"><\u002Fpath>\n  <path class=\"head\" d=\"M 790 86 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"box\" x=\"510\" y=\"180\" width=\"200\" height=\"52\" rx=\"4\"><\u002Frect>\n  <text class=\"ink lbl\" x=\"610\" y=\"212\" text-anchor=\"middle\">immagini vere<\u002Ftext>\n  <text class=\"muted cap\" x=\"610\" y=\"256\" text-anchor=\"middle\">dal dataset di addestramento<\u002Ftext>\n  <path class=\"arr\" d=\"M 710 206 H 778\"><\u002Fpath>\n  <path class=\"head\" d=\"M 790 206 l -14 -6 v 12 Z\"><\u002Fpath>\n\n  <rect class=\"boxa\" x=\"790\" y=\"60\" width=\"220\" height=\"172\" rx=\"4\"><\u002Frect>\n  <text class=\"acc lbl\" x=\"900\" y=\"140\" text-anchor=\"middle\">discriminatore<\u002Ftext>\n  <text class=\"muted cap\" x=\"900\" y=\"166\" text-anchor=\"middle\">probabilità che<\u002Ftext>\n  <text class=\"muted cap\" x=\"900\" y=\"186\" text-anchor=\"middle\">l'immagine sia vera<\u002Ftext>\n\n  <path class=\"tratt\" d=\"M 900 232 V 292 H 360 V 126\"><\u002Fpath>\n  <path class=\"headm\" d=\"M 360 112 l -6 14 h 12 Z\"><\u002Fpath>\n  <text class=\"muted cap\" x=\"630\" y=\"316\" text-anchor=\"middle\">segnale di addestramento<\u002Ftext>\n<\u002Fsvg><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;gap:70px;margin-top:26px;flex-shrink:0\"><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:25px;line-height:1.28\">Generatore e discriminatore sono addestrati <strong>a turno<\u002Fstrong>: il discriminatore a distinguere le immagini vere da quelle generate, il generatore a produrre immagini che il discriminatore classifica come vere.<\u002Fp><\u002Fdiv><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:25px;line-height:1.28\">In una <strong>GAN condizionata<\u002Fstrong> il generatore riceve, oltre al rumore o al suo posto, un <strong>condizionamento<\u002Fstrong>, cioè un'informazione che guida il risultato: nel lip sync, l'audio e la regione della bocca da riscrivere.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;gap:20px;align-items:flex-start\"><div style=\"width:12px;height:12px;background:#2f6bff;margin-top:9px;flex-shrink:0\"><\u002Fdiv><p style=\"margin:0;font-size:25px;line-height:1.28\">La generazione richiede <strong>una sola passata<\u002Fstrong> del generatore. L'addestramento invece è instabile, e il generatore può ridursi a produrre poche varianti (<strong>mode collapse<\u002Fstrong>).<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"margin-top:24px;border-top:2px solid #d4d7de;padding-top:18px;font-size:27px;color:#3f4a63;line-height:1.4\">GAN, Goodfellow et al., arXiv:1406.2661.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"30 Diagramma\" style=\"background:#fbfbf9;color:#14213d;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:90px 110px 60px;box-sizing:border-box\">\n  <div style=\"display:flex;align-items:center\"><div style=\"width:26px;height:26px;background:#2f6bff;flex-shrink:0\"><\u002Fdiv><div style=\"height:3px;flex:1;background:#14213d\"><\u002Fdiv><\u002Fdiv>\n  <h2 style=\"font-size:80px;font-weight:700;letter-spacing:-2px;line-height:1.05;margin:48px 0 26px;max-width:1560px\">Modelli di diffusione<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:flex;align-items:center\" data-enter=\"rise\"><div style=\"width:100%;height:100%;--ink:#14213d;--muted:#4d5a78;--accent:#2f6bff\"><svg style=\"width:100%;height:100%;display:block\" xmlns=\"http://www.w3.org/2000/svg\" sc-camel-view-box=\"0 0 1120 200\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" role=\"img\" aria-label=\"Modello di diffusione: cinque riquadri da solo rumore a una bocca schematica. In generazione, da sinistra a destra, a ogni passo una passata della rete toglie una parte del rumore; in addestramento, da destra a sinistra, a ogni passo si aggiunge rumore all'immagine. I passi sono decine\" xmlns:c2pa=\"http://c2pa.org/manifest\">\n  \n\n  <path class=\"tratt\" d=\"M 200 40 H 1100 M 200 40 V 52 M 1100 40 V 52\"><\u002Fpath>\n  <text class=\"acc cap\" x=\"650\" y=\"28\" text-anchor=\"middle\">decine di passi<\u002Ftext>\n  <text class=\"acc lbl\" x=\"182\" y=\"100\" text-anchor=\"end\">generazione<\u002Ftext>\n  <text class=\"muted lbl\" x=\"182\" y=\"140\" text-anchor=\"end\">addestramento<\u002Ftext>\n  <path class=\"grana\" opacity=\"0.050\" d=\"M225 129h5v5h-5zM230 124h5v5h-5zM235 149h5v5h-5zM240 99h5v5h-5zM240 119h5v5h-5zM250 124h5v5h-5zM250 159h5v5h-5zM255 109h5v5h-5zM265 79h5v5h-5zM270 149h5v5h-5zM290 119h5v5h-5z\"><\u002Fpath>\n  <path class=\"grana\" opacity=\"0.150\" d=\"M205 104h5v5h-5zM205 114h5v5h-5zM205 124h5v5h-5zM225 84h5v5h-5zM240 64h5v5h-5zM240 74h5v5h-5zM240 109h5v5h-5zM240 144h5v5h-5zM245 124h5v5h-5zM250 74h5v5h-5zM250 79h5v5h-5zM255 99h5v5h-5zM265 154h5v5h-5zM270 94h5v5h-5zM270 99h5v5h
